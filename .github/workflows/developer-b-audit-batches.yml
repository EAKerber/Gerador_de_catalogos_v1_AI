name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: write
jobs:
  integrate-browser-stress-snapshot:
    name: Integração mecânica — snapshots canônicos no navegador
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-b-05.18
          fetch-depth: 1
      - name: Aplicar serialização canônica
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/browser-stress-interface-05.18.test.js')
          source = path.read_text()
          old = '''  const modelSignature = () => page.evaluate(() => {
    const snapshot = JSON.parse(JSON.stringify(CatalogEditor.store.getState()));
    delete snapshot.editor;
    delete snapshot.updatedAt;
    return JSON.stringify(snapshot);
  });'''
          new = '''  const modelSignature = () => page.evaluate(() => {
    const snapshot = JSON.parse(JSON.stringify(CatalogEditor.store.getState()));
    delete snapshot.editor;
    delete snapshot.updatedAt;
    const canonicalize = value => {
      if (Array.isArray(value)) return value.map(canonicalize);
      if (value && typeof value === "object") return Object.fromEntries(Object.keys(value).sort().map(key => [key, canonicalize(value[key])]));
      return value;
    };
    return JSON.stringify(canonicalize(snapshot));
  });'''
          if new not in source:
              if old not in source:
                  raise SystemExit('Função modelSignature não encontrada')
              path.write_text(source.replace(old, new, 1))
          PY
          node --check tests/browser-stress-interface-05.18.test.js
          git diff --check
      - name: Commit na branch isolada
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Developer B Audit"
          git config user.email "developer-b-audit@users.noreply.github.com"
          git add tests/browser-stress-interface-05.18.test.js
          git commit -m "test: canoniza snapshots do estresse visual"
          git push origin HEAD:agent/developer-b-05.18
