name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: read
jobs:
  batch-5-2:
    name: Batch 5.2 — regressão mínima de reflow e histórico
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar regressão mínima
        run: node tests/reflow-history-stability-05.18.test.js
