name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: write
jobs:
  consolidate-icon-scale-css:
    name: DB-05.19.5 - consolidate icon scale CSS
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-b-05.18
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Move footer icon containment to canonical CSS
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          css_path = Path('styles/components.css')
          css = css_path.read_text()
          anchor = '.component-icon__svg { display: grid; width: min(86.4%, 48px); height: min(86.4%, 48px); place-items: center; }\n'
          rule = '.editor-component--footer-item > .component-children-layer > .editor-component--icon[data-slot-name="icon"] .component-icon__svg { width: min(100%, 26px); height: min(100%, 26px); max-width: 100%; max-height: 100%; }\n'
          if rule not in css:
              if css.count(anchor) != 1:
                  raise SystemExit(f'Canonical icon wrapper anchor count: {css.count(anchor)}')
              css_path.write_text(css.replace(anchor, anchor + rule, 1))

          Path('app/icon-scale-contract.js').write_text(base64.b64decode('').decode('utf-8'))
          PY
          node tools/build-developer-b-authoring-kit.js
          git diff --check
      - name: Run focused Node tests
        run: |
          node tests/icon-scale-persistence-05.18.5.test.js
          node tests/icon-scale-runtime-parity-05.18.5.test.js
          node tests/footer-item-containment-05.18.12.2.test.js
          node tests/footer-item-containment-build-05.18.12.2.test.js
          node tests/library-depth-05.18.test.js
          node tests/authoring-kit-runtime-contracts-05.18.test.js
      - name: Install Playwright and select system Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@latest
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome_path"
          "$chrome_path" --version
          echo "CATALOG_CHROMIUM_EXECUTABLE=$chrome_path" >> "$GITHUB_ENV"
      - name: Start editor
        run: |
          python -m http.server 8080 > /tmp/catalog-http.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8080/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/catalog-http.log
          exit 1
      - name: Run icon browser test and one stress seed
        env:
          CATALOG_BASE_URL: http://127.0.0.1:8080
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output/db-05.19.5/browser audit-output/db-05.19.5/stress
          timeout 180s node tests/browser-icon-scale-05.18.5.test.js 2>&1 | tee audit-output/db-05.19.5/browser/icon-scale.log
          timeout 180s node tests/browser-footer-item-containment-05.18.12.2.test.js 2>&1 | tee audit-output/db-05.19.5/browser/footer.log
          node tools/run-developer-b-stress.js --browser --repeat=1 --seed=5195001 --timeout=300000 --output=audit-output/db-05.19.5/stress 2>&1 | tee audit-output/db-05.19.5/browser/stress.log
      - name: Commit canonical icon containment
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff --name-only --relative | sort)
          allowed=(
            app/authoring-kit-files.js
            app/icon-scale-contract.js
            authoring-kit/capabilities.json
            authoring-kit/feature-inventory.json
            authoring-kit/runtime/icon-scale-contract.js
            docs/FEATURE-CATALOG.md
            styles/components.css
          )
          unexpected=()
          for file in "${actual[@]}"; do
            found=false
            for candidate in "${allowed[@]}"; do
              if [ "$file" = "$candidate" ]; then found=true; break; fi
            done
            if [ "$found" = false ]; then unexpected+=("$file"); fi
          done
          if [ "${#unexpected[@]}" -gt 0 ]; then
            echo "Unexpected tracked files:"
            printf '%s\n' "${unexpected[@]}"
            exit 1
          fi
          git config user.name "Developer B Audit"
          git config user.email "developer-b-audit@users.noreply.github.com"
          git add -A
          git commit -m "05.19 — consolida contenção da escala de ícone"
          git push origin HEAD:agent/developer-b-05.18
      - name: Prove idempotent build
        run: |
          node tools/build-developer-b-authoring-kit.js
          git diff --exit-code
          node tests/icon-scale-persistence-05.18.5.test.js
          node tests/icon-scale-runtime-parity-05.18.5.test.js
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-b-db-05.19.5
          path: audit-output/db-05.19.5
          if-no-files-found: warn
          retention-days: 14
