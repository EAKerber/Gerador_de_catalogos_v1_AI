name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: read
jobs:
  batch-7-4:
    name: Batch 7.4 — diagnóstico da specification compacta
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Iniciar editor
        run: |
          python -m http.server 8080 > /tmp/catalog-http.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8080/index.html >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Executar diagnóstico existente
        env:
          CATALOG_BASE_URL: http://127.0.0.1:8080
          CATALOG_DIAGNOSTIC_OUTPUT_DIR: ${{ github.workspace }}/audit-output/batch-7-4
        run: node tests/browser-medium-diagnostics-05.18.test.js
      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-b-batch-7-4-spec-diagnostic
          path: audit-output/batch-7-4
          if-no-files-found: error
          retention-days: 14
