name: Developer B Audit Batches

on:
  pull_request:
    branches:
      - development

permissions:
  contents: read

jobs:
  batch-0-static:
    name: Batch 0.1 — diagnóstico de sintaxe do estresse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Diagnosticar arquivos novos do batch
        id: syntax
        shell: bash
        run: |
          mkdir -p audit-output
          failures=0
          : > audit-output/syntax-results.txt
          for file in \
            tests/stress-domain-history-05.18.test.js \
            tests/browser-stress-interface-05.18.test.js \
            tests/developer-b-stress-runner-05.18.test.js \
            tools/run-developer-b-stress.js
          do
            echo "=== $file ===" | tee -a audit-output/syntax-results.txt
            if node --check "$file" >> audit-output/syntax-results.txt 2>&1; then
              echo "PASS" | tee -a audit-output/syntax-results.txt
            else
              echo "FAIL" | tee -a audit-output/syntax-results.txt
              failures=$((failures + 1))
            fi
          done
          echo "failures=$failures" | tee -a audit-output/syntax-results.txt
          exit "$failures"

      - name: Publicar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-b-batch-0-1-syntax
          path: audit-output
          if-no-files-found: error
          retention-days: 14
