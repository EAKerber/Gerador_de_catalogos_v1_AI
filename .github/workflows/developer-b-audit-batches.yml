name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: read
jobs:
  batch-5:
    name: Batch 5 — estresse de domínio e histórico
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar três sementes
        shell: bash
        run: |
          mkdir -p audit-output/batch-5
          node tools/run-developer-b-stress.js \
            --node \
            --repeat=3 \
            --seed=5182026 \
            --timeout=180000 \
            --output=audit-output/batch-5
      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-b-batch-5-domain-stress
          path: audit-output/batch-5
          if-no-files-found: error
          retention-days: 14
