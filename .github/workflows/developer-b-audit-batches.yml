name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: write
jobs:
  consolidate-table-binding-overrides:
    name: DB-05.19.1 — consolida overrides de tabela
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-b-05.18
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Incorporar comportamento ao store canônico
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          def decode(payload):
              return base64.b64decode(payload).decode("utf-8")

          def replace_b64(path, old_payload, new_payload):
              file = Path(path)
              source = file.read_text()
              old = decode(old_payload)
              new = decode(new_payload)
              if new in source:
                  return
              if source.count(old) != 1:
                  raise SystemExit(f"Trecho não encontrado de forma única em {path}")
              file.write_text(source.replace(old, new, 1))

          def write_b64(path, payload):
              file = Path(path)
              file.parent.mkdir(parents=True, exist_ok=True)
              file.write_text(decode(payload))

          replace_b64("app/document-store.js", "ICBjb25zdCBQUk9EVUNUX0ZJRUxEUyA9IFsidGl0bGUiLCAic3BlY09uZSIsICJzcGVjVHdvIiwgImNvZGUiLCAicGFja2FnZSIsICJwcmljZSIsICJhc3NldElkIl07Cg==", "ICBjb25zdCBQUk9EVUNUX0ZJRUxEUyA9IFsidGl0bGUiLCAic3BlY09uZSIsICJzcGVjVHdvIiwgImNvZGUiLCAicGFja2FnZSIsICJwcmljZSIsICJhc3NldElkIl07CiAgY29uc3QgVEFCTEVfQklORElOR19GSUVMRFMgPSBPYmplY3QuZnJlZXplKFsiY29kZSIsICJwYWNrYWdlIiwgInByaWNlIl0pOwo=")
          replace_b64("app/document-store.js", "", "")
          write_b64("app/table-binding-overrides-contract.js", "")
          write_b64("tests/table-binding-overrides-05.18.test.js", " document-store divergiu entre editor e AuthoringKit.");
assert(appShim === kitShim, "O shim divergiu entre editor e AuthoringKit.");
assert(CatalogTableBindingOverridesContract.VERSION === "05.19.1", "Versão inesperada do shim.");

console.log("✓ Overrides de tabela pertencem ao store canônico; shim não substitui classe e sincronizações internas permanecem limpas.");
")
          write_b64("docs/DEVELOPER-B-CONSOLIDATION-05.19.md", "IyBEZXZlbG9wZXIgQiDigJQgY2ljbG8gZGUgY29uc29saWRhw6fDo28gMDUuMTkKCiMjIEZpbmFsaWRhZGUKCkVzdGUgY2ljbG8gc3VjZWRlIG8gZmVjaGFtZW50byBvcGVyYWNpb25hbCBkbyAwNS4xOCBlIGNvbnRpbnVhIGV4Y2x1c2l2YW1lbnRlIGVtIGBhZ2VudC9kZXZlbG9wZXItYi0wNS4xOGA  yLiBQcmltZWlybyB0cmFuc2Zlc ")
          write_b64("docs/evidence/05.19/developer-b/DB-05.19.1-TABLE-BINDING-CONSOLIDATION.md", "IyBEQi0wNS4xOS4xIOKAlCBDb25zb2xpZGHDp8OjbyBkZSBvdmVycmlkZXMgZGUgdGFiZWxhCgojIyBSZXNwb25zYWJpbGlkYWRlCgpUcmFuc2Zlc ")
          PY
          node tools/build-developer-b-authoring-kit.js
          git diff --check
      - name: Validar domínio, histórico e paridade
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output/db-05.19.1/node
          tests=(
            tests/table-binding-overrides-05.18.test.js
            tests/reflow-history-stability-05.18.test.js
            tests/reflow-manual-baseline-05.18.test.js
            tests/stress-domain-history-05.18.test.js
            tests/authoring-kit-runtime-contracts-05.18.test.js
          )
          for file in "${tests[@]}"; do
            name="$(basename "$file" .test.js)"
            node "$file" 2>&1 | tee "audit-output/db-05.19.1/node/$name.log"
          done
          node --check app/document-store.js
          node --check app/table-binding-overrides-contract.js
          node --check tests/table-binding-overrides-05.18.test.js
      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Iniciar editor
        run: |
          python -m http.server 8080 > /tmp/catalog-http.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8080/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/catalog-http.log
          exit 1
      - name: Validar fluxo visual consumidor
        env:
          CATALOG_BASE_URL: http://127.0.0.1:8080
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output/db-05.19.1/browser
          timeout 180s node tests/browser-product-data-only-05.18.10.test.js 2>&1 | tee audit-output/db-05.19.1/browser/data-only.log
          mkdir -p audit-output/db-05.19.1/stress
          node tools/run-developer-b-stress.js             --browser             --repeat=1             --seed=5191001             --timeout=300000             --output=audit-output/db-05.19.1/stress 2>&1 | tee audit-output/db-05.19.1/browser/stress.log
      - name: Verificar superfície e fazer push
        shell: bash
        run: |
          set -euo pipefail
          allowed=$'app/authoring-kit-files.js\napp/document-store.js\napp/table-binding-overrides-contract.js\nauthoring-kit/runtime/document-store.js\nauthoring-kit/runtime/table-binding-overrides-contract.js\ndocs/DEVELOPER-B-CONSOLIDATION-05.19.md\ndocs/evidence/05.19/developer-b/DB-05.19.1-TABLE-BINDING-CONSOLIDATION.md\ntests/table-binding-overrides-05.18.test.js'
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          if [ "$actual" != "$allowed" ]; then
            echo "Conjunto inesperado de arquivos:"
            printf '%s\n' "$actual"
            git diff --stat
            exit 1
          fi
          git config user.name "Developer B Audit"
          git config user.email "developer-b-audit@users.noreply.github.com"
          git add $actual
          git commit -m "05.19 — consolida overrides de tabela no document-store"
          git push origin HEAD:agent/developer-b-05.18
      - name: Provar build idempotente
        run: |
          node tools/build-developer-b-authoring-kit.js
          git diff --exit-code
          node tests/table-binding-overrides-05.18.test.js
      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-b-db-05.19.1
          path: audit-output/db-05.19.1
          if-no-files-found: warn
          retention-days: 14
