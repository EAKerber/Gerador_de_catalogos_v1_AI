name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: read
jobs:
  batch-4:
    name: Batch 4 — receitas, manifestos e build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar testes de autoria
        shell: bash
        run: |
          mkdir -p audit-output/batch-4
          failures=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            log="audit-output/batch-4/$(basename "$file" .test.js).log"
            echo "=== $file ===" | tee -a audit-output/batch-4/summary.txt
            if node "$file" >"$log" 2>&1; then
              echo PASS | tee -a audit-output/batch-4/summary.txt
            else
              status=$?
              echo "FAIL status=$status" | tee -a audit-output/batch-4/summary.txt
              cat "$log"
              failures=$((failures + 1))
            fi
          done < tests/batches/developer-b-batch-4.txt
          echo "test_failures=$failures" | tee -a audit-output/batch-4/summary.txt
          exit "$failures"
      - name: Regenerar AuthoringKit
        id: build
        shell: bash
        run: |
          mkdir -p audit-output/batch-4
          node tools/build-developer-b-authoring-kit.js | tee audit-output/batch-4/build.log
          git status --short > audit-output/batch-4/build-status.txt
          git diff --stat > audit-output/batch-4/build-diff-stat.txt
          git diff > audit-output/batch-4/build.diff
      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-b-batch-4-recipes-build
          path: audit-output/batch-4
          if-no-files-found: error
          retention-days: 14
