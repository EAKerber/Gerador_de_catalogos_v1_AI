name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: read
jobs:
  batch-7-2:
    name: Batch 7.2 — confirmação de receitas e ícones
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Iniciar editor
        run: |
          python -m http.server 8080 > /tmp/catalog-http.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8080/index.html >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Executar casos focados
        shell: bash
        env:
          CATALOG_BASE_URL: http://127.0.0.1:8080
        run: |
          mkdir -p audit-output/batch-7-2
          failures=0
          tests=(
            tests/browser-specification-scale-05.18.6.test.js
            tests/browser-icon-scale-05.18.5.test.js
            tests/browser-section-heading-05.18.15.test.js
            tests/browser-fact-recipe-05.18.17.test.js
            tests/browser-callout-audit-05.18.19.test.js
            tests/browser-technical-icons-05.18.13.test.js
            tests/browser-commercial-icons-05.18.14.test.js
          )
          for file in "${tests[@]}"; do
            name="$(basename "$file" .test.js)"
            log="audit-output/batch-7-2/$name.log"
            start=$(date +%s)
            echo "=== $file ===" | tee -a audit-output/batch-7-2/summary.txt
            if timeout 120s node "$file" >"$log" 2>&1; then
              duration=$(( $(date +%s) - start ))
              echo "PASS duration=${duration}s" | tee -a audit-output/batch-7-2/summary.txt
            else
              status=$?
              duration=$(( $(date +%s) - start ))
              echo "FAIL status=$status duration=${duration}s" | tee -a audit-output/batch-7-2/summary.txt
              cat "$log"
              failures=$((failures + 1))
            fi
          done
          echo "failures=$failures" | tee -a audit-output/batch-7-2/summary.txt
          exit "$failures"
      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-b-batch-7-2-focused-visual
          path: audit-output/batch-7-2
          if-no-files-found: error
          retention-days: 14
