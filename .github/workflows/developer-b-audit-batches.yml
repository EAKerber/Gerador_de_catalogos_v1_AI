name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: write
jobs:
  integrate-specification-containment:
    name: Integração mecânica — contenção de specification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-b-05.18
          fetch-depth: 1
      - name: Aplicar correção
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('styles/components.css')
          source = path.read_text()
          old = 'height: min(29px, 100%); aspect-ratio: 1; justify-self: center;'
          new = 'height: min(29px, calc(100% - 4px)); aspect-ratio: 1; justify-self: center;'
          if new not in source:
              if old not in source:
                  raise SystemExit('Regra de specification não encontrada')
              path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit na branch isolada
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Developer B Audit"
          git config user.email "developer-b-audit@users.noreply.github.com"
          git add styles/components.css
          git commit -m "fix: contém círculo de specification na altura útil"
          git push origin HEAD:agent/developer-b-05.18
