name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: write
jobs:
  integrate-compact-specification:
    name: Integração mecânica — specification compacta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-b-05.18
          fetch-depth: 1
      - name: Aplicar correção
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('styles/components.css')
          source = path.read_text()
          old = '.component-specification__icon { display: grid; width: auto; height: min(29px, calc(100% - 4px)); aspect-ratio: 1; justify-self: center; place-items: center;'
          new = '.component-specification__icon { display: grid; width: min(29px, 100%); aspect-ratio: 1; justify-self: center; place-items: center;'
          if new not in source:
              if old not in source:
                  raise SystemExit('Regra base de specification não encontrada')
              source = source.replace(old, new, 1)
          compact = '.editor-component--product-card[data-presentation-density="compact"] .component-specification__icon { width: 24px; height: 24px; }'
          marker = '.editor-component--product-card[data-presentation-density="compact"] { --presentation-font-scale: .88; --presentation-icon-scale: .9; }'
          if compact not in source:
              if marker not in source:
                  raise SystemExit('Marcador de densidade compacta não encontrado')
              source = source.replace(marker, marker + '\n' + compact, 1)
          path.write_text(source)
          PY
          git diff --check
      - name: Commit na branch isolada
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Developer B Audit"
          git config user.email "developer-b-audit@users.noreply.github.com"
          git add styles/components.css
          git commit -m "fix: dimensiona specification compacta em 24px"
          git push origin HEAD:agent/developer-b-05.18
