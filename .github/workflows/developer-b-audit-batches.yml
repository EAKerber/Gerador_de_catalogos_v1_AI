name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: write
jobs:
  consolidate-table-binding-overrides:
    name: DB-05.19.1 - table binding consolidation
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-b-05.18
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch canonical document store
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          def decode(value):
              return base64.b64decode(value).decode('utf-8')

          def replace_once(path, old_value, new_value):
              file = Path(path)
              source = file.read_text()
              old = decode(old_value)
              new = decode(new_value)
              if new in source:
                  return
              if source.count(old) != 1:
                  raise SystemExit(f'Expected one match in {path}, found {source.count(old)}')
              file.write_text(source.replace(old, new, 1))

          replace_once(
              'app/document-store.js',
              'ICBjb25zdCBQUk9EVUNUX0ZJRUxEUyA9IFsidGl0bGUiLCAic3BlY09uZSIsICJzcGVjVHdvIiwgImNvZGUiLCAicGFja2FnZSIsICJwcmljZSIsICJhc3NldElkIl07Cg==',
              'ICBjb25zdCBQUk9EVUNUX0ZJRUxEUyA9IFsidGl0bGUiLCAic3BlY09uZSIsICJzcGVjVHdvIiwgImNvZGUiLCAicGFja2FnZSIsICJwcmljZSIsICJhc3NldElkIl07CiAgY29uc3QgVEFCTEVfQklORElOR19GSUVMRFMgPSBPYmplY3QuZnJlZXplKFsiY29kZSIsICJwYWNrYWdlIiwgInByaWNlIl0pOwo='
          )
          replace_once(
              'app/document-store.js',
              '',
              ''
          )
          PY
          node tools/build-developer-b-authoring-kit.js
          git diff --check
      - name: Run focused Node tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output/db-05.19.1/node
          for file in \
            tests/table-binding-overrides-05.18.test.js \
            tests/reflow-history-stability-05.18.test.js \
            tests/reflow-manual-baseline-05.18.test.js \
            tests/stress-domain-history-05.18.test.js \
            tests/authoring-kit-runtime-contracts-05.18.test.js
          do
            name="$(basename "$file" .test.js)"
            node "$file" 2>&1 | tee "audit-output/db-05.19.1/node/$name.log"
          done
          node --check app/document-store.js
          node --check app/table-binding-overrides-contract.js
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Start editor
        run: |
          python -m http.server 8080 > /tmp/catalog-http.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8080/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/catalog-http.log
          exit 1
      - name: Run focused browser checks
        env:
          CATALOG_BASE_URL: http://127.0.0.1:8080
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output/db-05.19.1/browser audit-output/db-05.19.1/stress
          timeout 180s node tests/browser-product-data-only-05.18.10.test.js 2>&1 | tee audit-output/db-05.19.1/browser/data-only.log
          node tools/run-developer-b-stress.js --browser --repeat=1 --seed=5191001 --timeout=300000 --output=audit-output/db-05.19.1/stress 2>&1 | tee audit-output/db-05.19.1/browser/stress.log
      - name: Commit canonical consolidation
        shell: bash
        run: |
          set -euo pipefail
          allowed=$'app/authoring-kit-files.js\napp/document-store.js\nauthoring-kit/runtime/document-store.js\nauthoring-kit/runtime/table-binding-overrides-contract.js'
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          if [ "$actual" != "$allowed" ]; then
            echo "Unexpected file set:"
            printf '%s\n' "$actual"
            git diff --stat
            exit 1
          fi
          git config user.name "Developer B Audit"
          git config user.email "developer-b-audit@users.noreply.github.com"
          git add $actual
          git commit -m "05.19 — consolida overrides de tabela no document-store"
          git push origin HEAD:agent/developer-b-05.18
      - name: Prove idempotent build
        run: |
          node tools/build-developer-b-authoring-kit.js
          git diff --exit-code
          node tests/table-binding-overrides-05.18.test.js
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-b-db-05.19.1
          path: audit-output/db-05.19.1
          if-no-files-found: warn
          retention-days: 14
