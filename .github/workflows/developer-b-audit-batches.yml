name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
    paths:
      - '.github/workflows/developer-b-audit-batches.yml'
      - 'app/**'
      - 'authoring-kit/**'
      - 'styles/**'
      - 'tests/**'
      - 'tools/**'
permissions:
  contents: read
jobs:
  consolidated-audit-05-19:
    name: DB-05.19 - stable consolidated audit
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and select system Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@latest
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome_path" ]; then
            echo "No system Chrome/Chromium executable found."
            exit 1
          fi
          "$chrome_path" --version
          echo "CATALOG_CHROMIUM_EXECUTABLE=$chrome_path" >> "$GITHUB_ENV"
      - name: Start editor
        run: |
          python -m http.server 8080 > /tmp/catalog-http.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8080/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/catalog-http.log
          exit 1
      - name: Run full audit and stress
        env:
          CATALOG_BASE_URL: http://127.0.0.1:8080
          CATALOG_STRESS_OUTPUT_DIR: audit-output/db-05.19-stable/domain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output/db-05.19-stable/consolidated audit-output/db-05.19-stable/browser-stress
          node tools/run-developer-b-audit.js --all 2>&1 | tee audit-output/db-05.19-stable/consolidated/audit.log
          node tests/stress-domain-history-05.18.test.js 2>&1 | tee audit-output/db-05.19-stable/consolidated/domain-stress.log
          node tools/run-developer-b-stress.js --browser --repeat=1 --seed=5194999 --timeout=300000 --output=audit-output/db-05.19-stable/browser-stress 2>&1 | tee audit-output/db-05.19-stable/consolidated/browser-stress.log
      - name: Verify consolidation and idempotence
        shell: bash
        run: |
          set -euo pipefail
          for file in table-binding-overrides-contract.js footer-item-containment-contract.js; do
            if find app authoring-kit -name "$file" -print -quit | grep -q .; then
              echo "Removed shim returned: $file"
              exit 1
            fi
          done
          if grep -R "CatalogTableBindingOverridesContract\|CatalogFooterItemContainmentContract" app/main.js app/authoring-kit-files.js tools/build-developer-b-authoring-kit.js authoring-kit/compiler tests/authoring-kit-runtime-contracts-05.18.test.js tests/stress-domain-history-05.18.test.js; then
            echo "Removed shim global returned."
            exit 1
          fi
          node tools/build-developer-b-authoring-kit.js 2>&1 | tee audit-output/db-05.19-stable/consolidated/idempotence.log
          if ! git diff --quiet; then
            git status --short | tee audit-output/db-05.19-stable/consolidated/unexpected-diff.txt
            git diff --stat | tee -a audit-output/db-05.19-stable/consolidated/unexpected-diff.txt
            exit 1
          fi
          git status --short > audit-output/db-05.19-stable/consolidated/final-status.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-b-db-05.19-stable-audit
          path: audit-output/db-05.19-stable
          if-no-files-found: error
          retention-days: 14
