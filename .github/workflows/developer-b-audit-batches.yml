name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: read
jobs:
  consolidated-audit-05-19:
    name: DB-05.19 - consolidated post-removal audit
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Start editor
        run: |
          python -m http.server 8080 > /tmp/catalog-http.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8080/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/catalog-http.log
          exit 1
      - name: Run full audit and stress
        env:
          CATALOG_BASE_URL: http://127.0.0.1:8080
          CATALOG_STRESS_OUTPUT_DIR: audit-output/db-05.19-final/domain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output/db-05.19-final/consolidated audit-output/db-05.19-final/browser-stress
          node tools/run-developer-b-audit.js --all 2>&1 | tee audit-output/db-05.19-final/consolidated/audit.log
          node tests/stress-domain-history-05.18.test.js 2>&1 | tee audit-output/db-05.19-final/consolidated/domain-stress.log
          node tools/run-developer-b-stress.js --browser --repeat=1 --seed=5192999 --timeout=300000 --output=audit-output/db-05.19-final/browser-stress 2>&1 | tee audit-output/db-05.19-final/consolidated/browser-stress.log
      - name: Verify removal and idempotence
        shell: bash
        run: |
          set -euo pipefail
          if find app authoring-kit -name 'table-binding-overrides-contract.js' -print -quit | grep -q .; then
            echo "Removed shim file returned."
            exit 1
          fi
          if grep -R "table-binding-overrides-contract\|CatalogTableBindingOverridesContract" app/main.js app/authoring-kit-files.js tools/build-developer-b-authoring-kit.js authoring-kit/compiler tests/table-binding-overrides-05.18.test.js tests/stress-domain-history-05.18.test.js; then
            echo "Executable shim reference returned."
            exit 1
          fi
          node tools/build-developer-b-authoring-kit.js 2>&1 | tee audit-output/db-05.19-final/consolidated/idempotence.log
          if ! git diff --quiet; then
            git status --short | tee audit-output/db-05.19-final/consolidated/unexpected-diff.txt
            git diff --stat | tee -a audit-output/db-05.19-final/consolidated/unexpected-diff.txt
            exit 1
          fi
          git status --short > audit-output/db-05.19-final/consolidated/final-status.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-b-db-05.19-final-audit
          path: audit-output/db-05.19-final
          if-no-files-found: error
          retention-days: 14
