name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: write
jobs:
  integrate-visual-smoke-fixes:
    name: Integração mecânica — smoke visual
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-b-05.18
          fetch-depth: 1
      - name: Aplicar alterações idempotentes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              source = file.read_text()
              if new in source:
                  return
              if old not in source:
                  raise SystemExit(f'Padrão não encontrado em {path}: {old!r}')
              file.write_text(source.replace(old, new, 1))

          replace_once(
              'index.html',
              '<head>\n',
              '<head>\n  <link rel="icon" href="data:," />\n'
          )
          replace_once(
              'tests/browser-text-overflow-05.18.4.test.js',
              'window.CatalogTextOverflowContract?.VERSION === "05.18.4"',
              'window.CatalogTextOverflowContract?.VERSION === "05.18.4.1"'
          )
          PY
      - name: Validar e publicar na branch isolada
        shell: bash
        run: |
          node --check tests/browser-text-overflow-05.18.4.test.js
          git diff --check
          if git diff --quiet; then
            echo "Alterações já aplicadas."
            exit 0
          fi
          git config user.name "Developer B Audit"
          git config user.email "developer-b-audit@users.noreply.github.com"
          git add index.html tests/browser-text-overflow-05.18.4.test.js
          git commit -m "fix: corrige ruído de favicon e versão do overflow"
          git push origin HEAD:agent/developer-b-05.18
