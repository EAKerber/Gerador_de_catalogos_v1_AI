name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: read
jobs:
  batch-5-2:
    name: Batch 5.2 — regressão mínima de reflow e histórico
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar regressão mínima
        shell: bash
        run: |
          mkdir -p audit-output/batch-5-2
          node tests/reflow-history-stability-05.18.test.js > audit-output/batch-5-2/test.log 2>&1
      - name: Publicar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-b-batch-5-2-reflow-log
          path: audit-output/batch-5-2
          if-no-files-found: error
          retention-days: 14
