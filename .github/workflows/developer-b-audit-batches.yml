name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: read
jobs:
  authoring-kit-build-diagnostic:
    name: Diagnóstico — sincronização do AuthoringKit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar AuthoringKit
        shell: bash
        run: |
          mkdir -p audit-output/authoring-kit-build
          node tools/build-developer-b-authoring-kit.js | tee audit-output/authoring-kit-build/build.log
          git status --short > audit-output/authoring-kit-build/status.txt
          git diff --name-status > audit-output/authoring-kit-build/name-status.txt
          git diff --stat > audit-output/authoring-kit-build/stat.txt
          git diff --numstat > audit-output/authoring-kit-build/numstat.txt
          git diff --binary > audit-output/authoring-kit-build/generated.patch
      - name: Validar artefatos regenerados
        shell: bash
        run: |
          set -euo pipefail
          node --check app/authoring-kit-files.js
          node --check authoring-kit/compiler/compile-catalog.js
          node --check authoring-kit/runtime/table-binding-overrides-contract.js
          node tests/authoring-kit-runtime-contracts-05.18.test.js
          node tests/table-binding-overrides-05.18.test.js
          node tests/section-recipes.test.js
          node tests/callout-manifest-05.18.19.test.js
          node tests/fact-manifest-05.18.17.test.js
          node -e 'JSON.parse(require("fs").readFileSync("authoring-kit/capabilities.json", "utf8")); JSON.parse(require("fs").readFileSync("authoring-kit/feature-inventory.json", "utf8"));'
          git diff --check
      - name: Publicar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-b-authoring-kit-build-diagnostic
          path: audit-output/authoring-kit-build
          if-no-files-found: error
          retention-days: 14
