name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
    paths:
      - '.github/workflows/developer-b-audit-batches.yml'
permissions:
  contents: write
jobs:
  consolidated-audit-05-19:
    name: DB-05.20.5 - repair frame panel through stable runner
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-b-05.18
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Move frame command into active tab panel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          file = Path('app/inspector.js')
          source = file.read_text()
          standalone = '        ${frameCommandSection}\n'
          if source.count(standalone) != 1:
              raise SystemExit(f'Standalone frame section count: {source.count(standalone)}')
          source = source.replace(standalone, '', 1)
          panels = {
              'structure': '          ${this.activeTab === "structure" ? frameCommandSection : ""}\n',
              'content': '          ${this.activeTab === "content" ? frameCommandSection : ""}\n',
              'style': '          ${this.activeTab === "style" ? frameCommandSection : ""}\n'
          }
          for panel, insertion in panels.items():
              opening = f'        <div class="inspector-tab-panel" role="tabpanel" data-inspector-panel="{panel}" ${{this.activeTab === "{panel}" ? "" : "hidden"}}>\n'
              if source.count(opening) != 1:
                  raise SystemExit(f'{panel} panel opening count: {source.count(opening)}')
              source = source.replace(opening, opening + insertion, 1)
          file.write_text(source)
          PY
          node --check app/inspector.js
          git diff --check
      - name: Install Playwright and select system Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@latest
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome_path"
          "$chrome_path" --version
          echo "CATALOG_CHROMIUM_EXECUTABLE=$chrome_path" >> "$GITHUB_ENV"
      - name: Start editor
        run: |
          python -m http.server 8080 > /tmp/catalog-http.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8080/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/catalog-http.log
          exit 1
      - name: Validate repaired frame panel
        env:
          CATALOG_BASE_URL: http://127.0.0.1:8080
          CATALOG_FRAME_OUTPUT_DIR: audit-output/db-05.20.5/frame-application
          CATALOG_GENERALIZATION_OUTPUT_DIR: audit-output/db-05.20.5/promotional
        run: |
          node tests/browser-frame-application-05.20.5.test.js
          node tests/browser-promotional-generalization-05.20.test.js
      - name: Commit repaired inspector
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | wc -l)" -eq 1
          git diff --name-only | grep -qx 'app/inspector.js'
          git config user.name 'Developer B Audit'
          git config user.email 'developer-b-audit@users.noreply.github.com'
          git add app/inspector.js
          git commit -m '05.20 — integra comando de frame ao painel ativo'
          git push origin HEAD:agent/developer-b-05.18
      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-b-frame-panel-repair-05.20.5
          path: audit-output/db-05.20.5
          if-no-files-found: warn
          retention-days: 14
