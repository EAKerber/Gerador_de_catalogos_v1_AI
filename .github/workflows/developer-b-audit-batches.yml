name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: write
jobs:
  integrate-batch-7-fixes:
    name: Integração mecânica — receitas e ícones
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-b-05.18
          fetch-depth: 1
      - name: Aplicar alterações idempotentes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              source = file.read_text()
              if new in source:
                  return
              if old not in source:
                  raise SystemExit(f'Padrão não encontrado em {path}: {old!r}')
              file.write_text(source.replace(old, new, 1))

          replace_once(
              'styles/components.css',
              '.component-icon__svg { display: grid; width: min(72%, 40px); height: min(72%, 40px); place-items: center; }',
              '.component-icon__svg { display: grid; width: min(86.4%, 48px); height: min(86.4%, 48px); place-items: center; }'
          )
          replace_once(
              'styles/components.css',
              '.component-icon__svg svg { width: 100%; height: 100%; transform: scale(var(--icon-content-scale, 1)); transform-origin: center; }',
              '.component-icon__svg svg { width: 83.333333%; height: 83.333333%; transform: scale(var(--icon-content-scale, 1)); transform-origin: center; }'
          )
          replace_once(
              'styles/components.css',
              '.component-specification__icon { display: grid; width: min(29px, 100%); aspect-ratio: 1; place-items: center;',
              '.component-specification__icon { display: grid; width: auto; height: min(29px, 100%); aspect-ratio: 1; justify-self: center; place-items: center;'
          )
          for path in ['app/icon-scale-contract.js', 'authoring-kit/runtime/icon-scale-contract.js']:
              replace_once(
                  path,
                  '  width: min(83.333333%, 26px);\n  height: min(83.333333%, 26px);',
                  '  width: min(100%, 26px);\n  height: min(100%, 26px);'
              )
          replace_once(
              'tests/browser-section-heading-05.18.15.test.js',
              '  await recipeButton.click();\n  await page.waitForFunction(() => CatalogEditor.store.getPage().children.filter(component => component.props?.recipeRole === "section-heading").length === 1);\n  await recipeButton.click();',
              '  await recipeButton.click();\n  await page.waitForFunction(() => CatalogEditor.store.getPage().children.filter(component => component.props?.recipeRole === "section-heading").length === 1);\n  await page.evaluate(() => CatalogEditor.store.setEditingContext(null));\n  await recipeButton.click();'
          )
          replace_once(
              'tests/browser-fact-recipe-05.18.17.test.js',
              '  for (let count = 2; count <= 4; count += 1) {\n    await recipeButton.click();',
              '  for (let count = 2; count <= 4; count += 1) {\n    await page.evaluate(() => CatalogEditor.store.setEditingContext(null));\n    await recipeButton.click();'
          )
          replace_once(
              'tests/browser-callout-audit-05.18.19.test.js',
              '  assert(after.undoCount === before + 1 && after.undoLabel === "Inserir estrutura pronta", "A inserção do callout não foi uma ação única.");\n  await recipeButton.click();',
              '  assert(after.undoCount === before + 1 && after.undoLabel === "Inserir estrutura pronta", "A inserção do callout não foi uma ação única.");\n  await page.evaluate(() => CatalogEditor.store.setEditingContext(null));\n  await recipeButton.click();'
          )
          PY
      - name: Validar e publicar na branch isolada
        shell: bash
        run: |
          node --check app/icon-scale-contract.js
          node --check authoring-kit/runtime/icon-scale-contract.js
          node --check tests/browser-section-heading-05.18.15.test.js
          node --check tests/browser-fact-recipe-05.18.17.test.js
          node --check tests/browser-callout-audit-05.18.19.test.js
          git diff --check
          if git diff --quiet; then
            echo "Alterações já aplicadas."
            exit 0
          fi
          git config user.name "Developer B Audit"
          git config user.email "developer-b-audit@users.noreply.github.com"
          git add styles/components.css app/icon-scale-contract.js authoring-kit/runtime/icon-scale-contract.js tests/browser-section-heading-05.18.15.test.js tests/browser-fact-recipe-05.18.17.test.js tests/browser-callout-audit-05.18.19.test.js
          git commit -m "fix: contém ícones escalados e explicita receitas irmãs"
          git push origin HEAD:agent/developer-b-05.18
