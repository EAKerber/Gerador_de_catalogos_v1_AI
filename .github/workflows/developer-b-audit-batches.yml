name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: read
jobs:
  batch-5-5:
    name: Batch 5.5 — confirmação de reflow e estresse de domínio
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regressão mínima
        run: node tests/reflow-history-stability-05.18.test.js
      - name: Estresse em três sementes
        run: |
          mkdir -p audit-output/batch-5-5
          node tools/run-developer-b-stress.js \
            --node \
            --repeat=3 \
            --seed=5182026 \
            --timeout=180000 \
            --output=audit-output/batch-5-5
      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-b-batch-5-5-domain-confirmation
          path: audit-output/batch-5-5
          if-no-files-found: warn
          retention-days: 14
