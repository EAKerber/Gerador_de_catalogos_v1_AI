name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: write
jobs:
  consolidate-footer-containment:
    name: DB-05.19.3 - consolidate footer containment
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-b-05.18
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Move geometry and styles to canonical surfaces
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          def decode(value):
              return base64.b64decode(value).decode('utf-8')

          def replace_b64(path, old64, new64):
              file = Path(path)
              source = file.read_text()
              old = decode(old64)
              new = decode(new64)
              if new in source:
                  return
              if source.count(old) != 1:
                  raise SystemExit(f'Expected one match in {path}, found {source.count(old)}')
              file.write_text(source.replace(old, new, 1))

          replace_b64(
              'app/component-registry.js',
              '',
              ''
          )
          replace_b64(
              'styles/components.css',
              'LmNvbXBvbmVudC1mb290ZXItaXRlbSB7IHdpZHRoOiAxMDAlOyBoZWlnaHQ6IDEwMCU7IG1pbi13aWR0aDogMDsgYm9yZGVyLXJpZ2h0OiAxcHggc29saWQgdmFyKC0tY29tcG9uZW50LWJvcmRlciwgI2Q5ZGNkZik7IHRleHQtYWxpZ246IGNlbnRlcjsgfQo=',
              ''
          )
          Path('app/footer-item-containment-contract.js').write_text(decode(''))
          browser = Path('tests/browser-footer-item-containment-05.18.12.2.test.js')
          source = browser.read_text()
          source = source.replace('CatalogFooterItemContainmentContract?.VERSION === "05.18.12.2"', 'CatalogFooterItemContainmentContract?.VERSION === "05.19.3"', 1)
          browser.write_text(source)
          PY
          node tools/build-developer-b-authoring-kit.js
          git diff --check
      - name: Run focused Node tests
        run: |
          node tests/footer-item-containment-05.18.12.2.test.js
          node tests/footer-item-containment-build-05.18.12.2.test.js
          node tests/icon-scale-runtime-parity-05.18.5.test.js
          node tests/authoring-kit-runtime-contracts-05.18.test.js
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Start editor
        run: |
          python -m http.server 8080 > /tmp/catalog-http.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8080/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/catalog-http.log
          exit 1
      - name: Run footer browser test and one stress seed
        env:
          CATALOG_BASE_URL: http://127.0.0.1:8080
        run: |
          mkdir -p audit-output/db-05.19.3
          timeout 180s node tests/browser-footer-item-containment-05.18.12.2.test.js 2>&1 | tee audit-output/db-05.19.3/footer-browser.log
          node tools/run-developer-b-stress.js --browser --repeat=1 --seed=5193001 --timeout=300000 --output=audit-output/db-05.19.3/stress 2>&1 | tee audit-output/db-05.19.3/stress.log
      - name: Commit canonical footer containment
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff --name-only --relative | sort)
          allowed=(
            app/authoring-kit-files.js
            app/component-registry.js
            app/footer-item-containment-contract.js
            authoring-kit/capabilities.json
            authoring-kit/feature-inventory.json
            authoring-kit/runtime/component-registry.js
            authoring-kit/runtime/footer-item-containment-contract.js
            docs/FEATURE-CATALOG.md
            styles/components.css
            tests/browser-footer-item-containment-05.18.12.2.test.js
          )
          unexpected=()
          for file in "${actual[@]}"; do
            found=false
            for candidate in "${allowed[@]}"; do
              if [ "$file" = "$candidate" ]; then found=true; break; fi
            done
            if [ "$found" = false ]; then unexpected+=("$file"); fi
          done
          if [ "${#unexpected[@]}" -gt 0 ]; then
            echo "Unexpected tracked files:"
            printf '%s\n' "${unexpected[@]}"
            exit 1
          fi
          git config user.name "Developer B Audit"
          git config user.email "developer-b-audit@users.noreply.github.com"
          git add -A
          git commit -m "05.19 — consolida contenção do footer-item"
          git push origin HEAD:agent/developer-b-05.18
      - name: Prove idempotent build
        run: |
          node tools/build-developer-b-authoring-kit.js
          git diff --exit-code
          node tests/footer-item-containment-05.18.12.2.test.js
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-b-db-05.19.3
          path: audit-output/db-05.19.3
          if-no-files-found: warn
          retention-days: 14
