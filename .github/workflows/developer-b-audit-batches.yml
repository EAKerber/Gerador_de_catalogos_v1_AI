name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: read
jobs:
  diagnose-icon-scale-removal:
    name: DB-05.19.6 - diagnose residual icon shim references
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply removal in diagnostic workspace
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p audit-output/db-05.19.6-diagnostic
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              source = file.read_text()
              if source.count(old) != 1:
                  raise SystemExit(f'Expected one match in {path}, found {source.count(old)} for {old!r}')
              file.write_text(source.replace(old, new, 1))
              print('patched', path, repr(old))

          replace_once('app/main.js', '    { file: "icon-scale-contract.js", globalName: "CatalogIconScaleContract" },\n', '')
          replace_once('app/main.js', '    window.CatalogIconScaleContract?.install();\n', '')
          replace_once('tools/build-developer-b-authoring-kit.js', '  "icon-scale-contract.js",\n', '')
          replace_once('authoring-kit/compiler/compile-catalog.js', '  "icon-scale-contract.js",\n', '')
          replace_once('authoring-kit/compiler/compile-catalog.js', 'CatalogIconScaleContract.install();\n', '')

          for test in Path('tests').glob('*.test.js'):
              source = test.read_text()
              source = source.replace('  "app/icon-scale-contract.js",\n', '')
              source = source.replace('CatalogIconScaleContract.install();\n', '')
              source = source.replace('  CatalogIconScaleContract,\n', '')
              if test.name == 'authoring-kit-runtime-contracts-05.18.test.js':
                  source = source.replace('  "icon-scale-contract.js",\n', '')
                  source = source.replace('  "CatalogIconScaleContract",\n', '')
              test.write_text(source)
          PY
          rm app/icon-scale-contract.js authoring-kit/runtime/icon-scale-contract.js
          node tools/build-developer-b-authoring-kit.js
          grep -R -n "icon-scale-contract\|CatalogIconScaleContract" app authoring-kit tests tools > audit-output/db-05.19.6-diagnostic/references.txt || true
          git status --short > audit-output/db-05.19.6-diagnostic/status.txt
          git diff --name-status > audit-output/db-05.19.6-diagnostic/name-status.txt
          cat audit-output/db-05.19.6-diagnostic/references.txt
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-b-db-05.19.6-diagnostic
          path: audit-output/db-05.19.6-diagnostic
          if-no-files-found: error
          retention-days: 14
