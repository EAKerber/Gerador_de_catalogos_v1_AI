name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: write
jobs:
  commit-table-binding-consolidation:
    name: DB-05.19.1 - commit validated consolidation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-b-05.18
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and build
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          def replace_once(path, old64, new64):
              file = Path(path)
              source = file.read_text()
              old = base64.b64decode(old64).decode('utf-8')
              new = base64.b64decode(new64).decode('utf-8')
              if new in source:
                  return
              if source.count(old) != 1:
                  raise SystemExit(f'Expected one match in {path}, found {source.count(old)}')
              file.write_text(source.replace(old, new, 1))

          replace_once(
              'app/document-store.js',
              'ICBjb25zdCBQUk9EVUNUX0ZJRUxEUyA9IFsidGl0bGUiLCAic3BlY09uZSIsICJzcGVjVHdvIiwgImNvZGUiLCAicGFja2FnZSIsICJwcmljZSIsICJhc3NldElkIl07Cg==',
              'ICBjb25zdCBQUk9EVUNUX0ZJRUxEUyA9IFsidGl0bGUiLCAic3BlY09uZSIsICJzcGVjVHdvIiwgImNvZGUiLCAicGFja2FnZSIsICJwcmljZSIsICJhc3NldElkIl07CiAgY29uc3QgVEFCTEVfQklORElOR19GSUVMRFMgPSBPYmplY3QuZnJlZXplKFsiY29kZSIsICJwYWNrYWdlIiwgInByaWNlIl0pOwo='
          )
          replace_once(
              'app/document-store.js',
              '',
              ''
          )
          PY
          node tools/build-developer-b-authoring-kit.js
          git diff --check
      - name: Focused validation
        run: |
          node tests/table-binding-overrides-05.18.test.js
          node tests/reflow-history-stability-05.18.test.js
          node tests/reflow-manual-baseline-05.18.test.js
          node tests/stress-domain-history-05.18.test.js
          node tests/authoring-kit-runtime-contracts-05.18.test.js
      - name: Commit allowed generated subset
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git status --short | sed -E 's/^.. //' | sort)
          allowed=(
            app/authoring-kit-files.js
            app/document-store.js
            authoring-kit/capabilities.json
            authoring-kit/feature-inventory.json
            authoring-kit/runtime/document-store.js
            authoring-kit/runtime/table-binding-overrides-contract.js
            docs/FEATURE-CATALOG.md
          )
          unexpected=()
          for file in "${actual[@]}"; do
            found=false
            for candidate in "${allowed[@]}"; do
              if [ "$file" = "$candidate" ]; then found=true; break; fi
            done
            if [ "$found" = false ]; then unexpected+=("$file"); fi
          done
          if [ "${#unexpected[@]}" -gt 0 ]; then
            echo "Unexpected files:"
            printf '%s\n' "${unexpected[@]}"
            exit 1
          fi
          printf 'Generated files to commit:\n'
          printf '%s\n' "${actual[@]}"
          git config user.name "Developer B Audit"
          git config user.email "developer-b-audit@users.noreply.github.com"
          git add "${actual[@]}"
          git commit -m "05.19 — consolida overrides de tabela no document-store"
          git push origin HEAD:agent/developer-b-05.18
      - name: Prove idempotent build
        run: |
          node tools/build-developer-b-authoring-kit.js
          git diff --exit-code
          node tests/table-binding-overrides-05.18.test.js
