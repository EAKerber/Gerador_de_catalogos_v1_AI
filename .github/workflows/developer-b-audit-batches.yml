name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: read
jobs:
  batch-8-2:
    name: Batch 8.2 — baseline de histórico após reflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar regressões focadas
        shell: bash
        run: |
          mkdir -p audit-output/batch-8-2
          failures=0
          tests=(
            tests/reflow-history-stability-05.18.test.js
            tests/reflow-manual-baseline-05.18.test.js
          )
          for file in "${tests[@]}"; do
            log="audit-output/batch-8-2/$(basename "$file" .test.js).log"
            echo "=== $file ===" | tee -a audit-output/batch-8-2/summary.txt
            if node "$file" >"$log" 2>&1; then
              echo PASS | tee -a audit-output/batch-8-2/summary.txt
            else
              status=$?
              echo "FAIL status=$status" | tee -a audit-output/batch-8-2/summary.txt
              cat "$log"
              failures=$((failures + 1))
            fi
          done
          echo "failures=$failures" | tee -a audit-output/batch-8-2/summary.txt
          exit "$failures"
      - name: Executar uma semente de domínio
        if: success()
        run: |
          mkdir -p audit-output/batch-8-2/domain-run
          node tools/run-developer-b-stress.js \
            --node \
            --repeat=1 \
            --seed=5182026 \
            --timeout=180000 \
            --output=audit-output/batch-8-2/domain-run
      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-b-batch-8-2-reflow-baseline
          path: audit-output/batch-8-2
          if-no-files-found: error
          retention-days: 14
