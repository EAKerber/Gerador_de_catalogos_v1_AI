name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: read
jobs:
  consolidated-audit:
    name: Auditoria consolidada — Node, build e Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Iniciar editor
        run: |
          python -m http.server 8080 > /tmp/catalog-http.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8080/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/catalog-http.log
          exit 1
      - name: Executar auditoria completa
        env:
          CATALOG_BASE_URL: http://127.0.0.1:8080
        run: |
          set -euo pipefail
          mkdir -p audit-output/consolidated
          node tools/run-developer-b-audit.js --all 2>&1 | tee audit-output/consolidated/audit.log
          node tools/build-developer-b-authoring-kit.js 2>&1 | tee audit-output/consolidated/idempotence.log
          if ! git diff --quiet; then
            git status --short | tee audit-output/consolidated/unexpected-diff.txt
            git diff --stat | tee -a audit-output/consolidated/unexpected-diff.txt
            exit 1
          fi
          git status --short > audit-output/consolidated/final-status.txt
      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-b-consolidated-audit
          path: audit-output/consolidated
          if-no-files-found: error
          retention-days: 14
