name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: read
jobs:
  batch-3:
    name: Batch 3 — geometria e contenção
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar lote
        shell: bash
        run: |
          mkdir -p audit-output/batch-3
          failures=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            log="audit-output/batch-3/$(basename "$file" .test.js).log"
            echo "=== $file ===" | tee -a audit-output/batch-3/summary.txt
            if node "$file" >"$log" 2>&1; then
              echo PASS | tee -a audit-output/batch-3/summary.txt
            else
              status=$?
              echo "FAIL status=$status" | tee -a audit-output/batch-3/summary.txt
              cat "$log"
              failures=$((failures + 1))
            fi
          done < tests/batches/developer-b-batch-3.txt
          echo "failures=$failures" | tee -a audit-output/batch-3/summary.txt
          exit "$failures"
      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-b-batch-3-geometry
          path: audit-output/batch-3
          if-no-files-found: error
          retention-days: 14
