name: Developer B Audit Batches
on:
  pull_request:
    branches: [development]
permissions:
  contents: write
jobs:
  fix-table-binding-overrides:
    name: Correção focada — overrides de tabela vinculada
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-b-05.18
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrar correção e regressão
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          def write_b64(path, payload):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_bytes(base64.b64decode(payload))

          def replace_once(path, old, new):
              file = Path(path)
              source = file.read_text()
              if new in source:
                  return
              if old not in source:
                  raise SystemExit(f'Padrão não encontrado em {path}: {old!r}')
              file.write_text(source.replace(old, new, 1))

          write_b64('app/table-binding-overrides-contract.js', '')
          write_b64('authoring-kit/runtime/table-binding-overrides-contract.js', '')
          write_b64('tests/table-binding-overrides-05.18.test.js', ' : ')

          store_path = Path('app/document-store.js')
          store = store_path.read_text()
          old_call = 'this.replaceTableRowsBulk(table.id, product.metadata?.commercialRows || [{ values: product.metadata?.values || {} }], { mode: "replace" });'
          new_call = 'this.replaceTableRowsBulk(table.id, product.metadata?.commercialRows || [{ values: product.metadata?.values || {} }], { mode: "replace", bindingSync: true });'
          if old_call in store:
              count = store.count(old_call)
              if count != 2:
                  raise SystemExit(f'Esperadas 2 materializações internas; encontradas {count}.')
              store_path.write_text(store.replace(old_call, new_call))
          elif store.count(new_call) != 2:
              raise SystemExit('As duas materializações internas não estão marcadas como bindingSync.')

          replace_once(
              'app/main.js',
              '    { file: "callout-recipe-contract.js", globalName: "CatalogCalloutRecipeContract" },\n    { file: "text-alignment-contract.js", globalName: "CatalogTextAlignmentContract" },',
              '    { file: "callout-recipe-contract.js", globalName: "CatalogCalloutRecipeContract" },\n    { file: "table-binding-overrides-contract.js", globalName: "CatalogTableBindingOverridesContract" },\n    { file: "text-alignment-contract.js", globalName: "CatalogTextAlignmentContract" },'
          )
          replace_once(
              'app/main.js',
              '    window.CatalogCalloutRecipeContract?.install();\n    window.CatalogTextAlignmentContract?.install();',
              '    window.CatalogCalloutRecipeContract?.install();\n    window.CatalogTableBindingOverridesContract?.install();\n    window.CatalogTextAlignmentContract?.install();'
          )
          replace_once(
              'authoring-kit/compiler/compile-catalog.js',
              '  "reflow-history-stability-contract.js",\n  "catalog-validator.js",',
              '  "reflow-history-stability-contract.js",\n  "table-binding-overrides-contract.js",\n  "catalog-validator.js",'
          )
          replace_once(
              'authoring-kit/compiler/compile-catalog.js',
              'CatalogReflowHistoryStabilityContract.install();',
              'CatalogReflowHistoryStabilityContract.install();\nCatalogTableBindingOverridesContract.install();'
          )
          replace_once(
              'tools/build-developer-b-authoring-kit.js',
              '  "reflow-history-stability-contract.js",\n  "component-intent-registry.js",',
              '  "reflow-history-stability-contract.js",\n  "table-binding-overrides-contract.js",\n  "component-intent-registry.js",'
          )
          replace_once(
              'tests/stress-domain-history-05.18.test.js',
              '  "app/product-data-only-contract.js",\n  "app/reflow-history-stability-contract.js"\n]',
              '  "app/product-data-only-contract.js",\n  "app/reflow-history-stability-contract.js",\n  "app/table-binding-overrides-contract.js"\n]'
          )
          replace_once(
              'tests/stress-domain-history-05.18.test.js',
              '  CatalogProductVariantsContract,\n  CatalogProductDataOnlyContract\n]',
              '  CatalogProductVariantsContract,\n  CatalogProductDataOnlyContract,\n  CatalogTableBindingOverridesContract\n]'
          )
          PY
      - name: Validar correção focada
        shell: bash
        run: |
          set -euo pipefail
          node --check app/table-binding-overrides-contract.js
          node --check authoring-kit/runtime/table-binding-overrides-contract.js
          node --check tests/table-binding-overrides-05.18.test.js
          node --check app/main.js
          node --check authoring-kit/compiler/compile-catalog.js
          node --check tools/build-developer-b-authoring-kit.js
          node --check tests/stress-domain-history-05.18.test.js
          cmp app/table-binding-overrides-contract.js authoring-kit/runtime/table-binding-overrides-contract.js
          test "$(grep -F 'bindingSync: true' app/document-store.js | wc -l)" -eq 2
          node tests/table-binding-overrides-05.18.test.js
          node tests/reflow-history-stability-05.18.test.js
          node tests/reflow-manual-baseline-05.18.test.js
          mkdir -p audit-output/table-binding
          node tools/run-developer-b-stress.js \
            --node \
            --repeat=1 \
            --seed=5182026 \
            --timeout=180000 \
            --output=audit-output/table-binding
          git diff --check
      - name: Commit na branch isolada
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Correção já integrada."
            exit 0
          fi
          git config user.name "Developer B Audit"
          git config user.email "developer-b-audit@users.noreply.github.com"
          git add \
            app/document-store.js \
            app/main.js \
            app/table-binding-overrides-contract.js \
            authoring-kit/compiler/compile-catalog.js \
            authoring-kit/runtime/table-binding-overrides-contract.js \
            tools/build-developer-b-authoring-kit.js \
            tests/stress-domain-history-05.18.test.js \
            tests/table-binding-overrides-05.18.test.js
          git commit -m "fix: preserva overrides de tabelas vinculadas"
          git push origin HEAD:agent/developer-b-05.18
      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-b-table-binding-fix
          path: audit-output/table-binding
          if-no-files-found: warn
          retention-days: 14
