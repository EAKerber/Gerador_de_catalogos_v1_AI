name: Developer B Reference Consolidation Commit
on:
  pull_request:
    branches: [development]
    paths:
      - '.github/workflows/developer-b-reference-consolidation-commit.yml'
permissions:
  contents: write
jobs:
  consolidate-references:
    name: DB-05.20.3 - consolidate reference diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-b-05.18
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch promotional benchmark reference gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          file = Path('tests/browser-promotional-generalization-05.20.test.js')
          source = file.read_text()

          replacements = [
              (
                  '    const pageLevel = CatalogEditor.store.getPage().children;\n    return {',
                  '    const pageLevel = CatalogEditor.store.getPage().children;\n    const publicationReport = CatalogEditor.store.getPublicationReport("draft");\n    return {',
                  'publication setup'
              ),
              (
                  '      history: CatalogEditor.store.getHistoryState(),\n      publication: CatalogEditor.store.getPublicationReport("draft").summary',
                  '      history: CatalogEditor.store.getHistoryState(),\n      publication: publicationReport.summary,\n      references: publicationReport.references',
                  'publication return'
              ),
              (
                  '  if (metrics.publication.overflows > 0) findings.push({ code: "PUBLICATION_OVERFLOWS", count: metrics.publication.overflows });\n  if (metrics.placeholderArts > 0) findings.push({ code: "PLACEHOLDER_ASSETS", count: metrics.placeholderArts, message: "Assets comerciais não estavam disponíveis no runner; arte foi avaliada estruturalmente." });',
                  '  if (metrics.publication.overflows > 0) findings.push({ code: "PUBLICATION_OVERFLOWS", count: metrics.publication.overflows });\n  if (metrics.publication.missingReferences > 0) blockers.push({ code: "MISSING_REFERENCES", count: metrics.publication.missingReferences, items: metrics.references?.missing || [] });\n  const optionalProducts = (metrics.references?.optional || []).filter(item => item.kind === "product" && item.reason === "local-content");\n  const optionalAssets = (metrics.references?.optional || []).filter(item => item.kind === "asset" && item.reason === "placeholder-without-asset");\n  if (optionalProducts.length !== 1 || optionalAssets.length !== metrics.placeholderArts) blockers.push({ code: "OPTIONAL_REFERENCE_CLASSIFICATION", expected: { products: 1, assets: metrics.placeholderArts }, observed: { products: optionalProducts.length, assets: optionalAssets.length }, items: metrics.references?.optional || [] });\n  if (metrics.placeholderArts > 0) findings.push({ code: "PLACEHOLDER_ASSETS", count: metrics.placeholderArts, message: "Assets comerciais não estavam disponíveis no runner; arte foi avaliada estruturalmente." });',
                  'publication assertions'
              )
          ]
          for old, new, label in replacements:
              if new in source:
                  continue
              if source.count(old) != 1:
                  raise SystemExit(f'{label}: expected one target, found {source.count(old)}')
              source = source.replace(old, new, 1)
          file.write_text(source)
          PY
          node --check tests/browser-promotional-generalization-05.20.test.js
      - name: Regenerate embedded AuthoringKit
        run: node tools/build-developer-b-authoring-kit.js
      - name: Verify and commit derived files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff --name-only --relative | sort)
          unexpected=()
          for file in "${actual[@]}"; do
            case "$file" in
              app/authoring-kit-files.js|authoring-kit/capabilities.json|authoring-kit/feature-inventory.json|docs/FEATURE-CATALOG.md|tests/browser-promotional-generalization-05.20.test.js) ;;
              *) unexpected+=("$file") ;;
            esac
          done
          if [ "${#unexpected[@]}" -gt 0 ]; then
            echo 'Unexpected generated files:'
            printf '%s\n' "${unexpected[@]}"
            exit 1
          fi
          node tests/reference-report-05.20.3.test.js
          git diff --check
          git config user.name 'Developer B Audit'
          git config user.email 'developer-b-audit@users.noreply.github.com'
          git add -A
          git commit -m '05.20 — consolida diagnóstico detalhado de referências'
          git push origin HEAD:agent/developer-b-05.18
