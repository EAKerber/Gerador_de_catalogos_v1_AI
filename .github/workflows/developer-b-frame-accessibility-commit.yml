name: Developer B Frame Accessibility Commit
on:
  pull_request:
    branches: [development]
    paths:
      - '.github/workflows/developer-b-frame-accessibility-commit.yml'
permissions:
  contents: write
jobs:
  expose-frame-command:
    name: DB-05.20.5 - expose joint frame command
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-b-05.18
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote frame command and update benchmarks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          file = Path('app/inspector.js')
          source = file.read_text()

          if 'const frameCommandSection = `' not in source:
              start_marker = '          <div class="recommended-minimum-editor frame-command-editor">'
              end_marker = '          <div class="inspector-section__heading"><h4>Ajuste imediato por campo</h4><span>compatibilidade</span></div>'
              start = source.find(start_marker, source.find('const geometrySection = `'))
              end = source.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit(f'Frame command boundaries not found: start={start}, end={end}')
              source = source[:start] + source[end:]

              geometry_marker = '      const geometrySection = `\n'
              geometry_at = source.find(geometry_marker)
              if geometry_at < 0:
                  raise SystemExit('Geometry declaration not found.')
              command = '''      const frameCommandSection = `
                <section class="inspector-section inspector-section--frame-command">
                  <div class="inspector-section__heading"><h3 class="inspector-section__title">Posição e tamanho</h3><span>aplicação conjunta</span></div>
                  <div class="recommended-minimum-editor frame-command-editor">
                    <div class="inspector-grid">
                      ${["x", "y", "width", "height"].map(key => `<div class="inspector-field"><label>${key === "width" ? "Largura" : key === "height" ? "Altura" : key.toUpperCase()}</label><input type="number" step="1" value="${Math.round(component.frame[key])}" data-frame-draft-path="${key}" /></div>`).join("")}
                    </div>
                    <div class="inspector-field inspector-field--full" style="margin-top:10px"><label>Posição sugerida</label><select data-frame-preset><option value="custom">Valores atuais</option><option value="safe-top">Topo seguro</option><option value="safe-bottom">Base segura</option><option value="left-column">Coluna esquerda</option><option value="main-column">Coluna principal</option><option value="full-width">Faixa total</option></select></div>
                    <button type="button" class="inspector-action--primary inspector-action--wide" data-frame-apply-all>Aplicar posição e tamanho</button>
                    <p class="inspector-note">O documento só muda ao aplicar; mínimos, limites e autoridade de layout continuam respeitados.</p>
                  </div>
                </section>`;
          '''
              source = source[:geometry_at] + command + source[geometry_at:]

          if '${frameCommandSection}' not in source:
              panel_marker = '        <div class="inspector-tab-panel" role="tabpanel" data-inspector-panel="structure"'
              panel_at = source.find(panel_marker)
              if panel_at < 0:
                  raise SystemExit('Inspector structure panel not found.')
              source = source[:panel_at] + '        ${frameCommandSection}\n' + source[panel_at:]

          if source.count('data-frame-draft-path=') != 4:
              raise SystemExit(f'Expected four essential frame draft inputs, found {source.count("data-frame-draft-path=")}')
          file.write_text(source)

          file = Path('tests/browser-frame-application-05.20.5.test.js')
          source = file.read_text()
          click = '  await page.locator("[data-toggle-all-properties]").first().click();\n'
          assertion = '  assert(await page.locator(\'[data-toggle-all-properties]\').first().getAttribute("aria-pressed") === "false", "A aplicação conjunta não deveria depender da abertura do painel avançado.");\n'
          if click in source:
              source = source.replace(click, assertion, 1)
          elif assertion not in source:
              raise SystemExit('Frame test advanced toggle target not found.')
          file.write_text(source)

          file = Path('tests/browser-promotional-generalization-05.20.test.js')
          source = file.read_text()
          simple = '''async function showAdvancedGeometry() {
            await page.locator('[data-frame-draft-path="x"]').waitFor({ state: "visible" });
          }'''
          if simple not in source:
              start = source.find('async function showAdvancedGeometry() {')
              end_marker = '\n}\n\nasync function setFrame'
              end = source.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit(f'Benchmark geometry helper boundaries not found: start={start}, end={end}')
              source = source[:start] + simple + source[end + 2:]
          file.write_text(source)
          PY
          node --check app/inspector.js
          node --check tests/browser-frame-application-05.20.5.test.js
          node --check tests/browser-promotional-generalization-05.20.test.js
          git diff --check
      - name: Commit accessible frame command
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff --name-only --relative | sort)
          test "${#actual[@]}" -eq 3
          printf '%s\n' "${actual[@]}" | grep -qx 'app/inspector.js'
          printf '%s\n' "${actual[@]}" | grep -qx 'tests/browser-frame-application-05.20.5.test.js'
          printf '%s\n' "${actual[@]}" | grep -qx 'tests/browser-promotional-generalization-05.20.test.js'
          git config user.name 'Developer B Audit'
          git config user.email 'developer-b-audit@users.noreply.github.com'
          git add -A
          git commit -m '05.20 — torna aplicação conjunta de frame sempre acessível'
          git push origin HEAD:agent/developer-b-05.18
