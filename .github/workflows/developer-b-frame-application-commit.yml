name: Developer B Frame Application Commit
on:
  pull_request:
    branches: [development]
    paths:
      - '.github/workflows/developer-b-frame-application-commit.yml'
permissions:
  contents: write
jobs:
  implement-frame-application:
    name: DB-05.20.5 - implement joint frame application
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-b-05.18
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch canonical store and inspector
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          for path in ['app/document-store.js', 'authoring-kit/runtime/document-store.js']:
              file = Path(path)
              source = file.read_text()
              old = '      const selection = this.getBatchSelection(valid.map(entry => entry.id));\n'
              new = '      const selection = this.getBatchSelection(valid.map(entry => entry.id), 1);\n'
              if new not in source:
                  if source.count(old) != 1:
                      raise SystemExit(f'{path}: selection target count {source.count(old)}')
                  source = source.replace(old, new, 1)
              file.write_text(source)

          file = Path('app/inspector.js')
          source = file.read_text()

          old = '''          <h3 class="inspector-section__title">Posição e tamanho</h3>
                    <div class="inspector-grid">'''
          new = '''          <h3 class="inspector-section__title">Posição e tamanho</h3>
                    <div class="recommended-minimum-editor frame-command-editor">
                      <div class="inspector-section__heading"><h4>Aplicação conjunta</h4><span>uma ação no histórico</span></div>
                      <div class="inspector-grid">
                        ${["x", "y", "width", "height"].map(key => `<div class="inspector-field"><label>${key === "width" ? "Largura" : key === "height" ? "Altura" : key.toUpperCase()}</label><input type="number" step="1" value="${Math.round(component.frame[key])}" data-frame-draft-path="${key}" /></div>`).join("")}
                      </div>
                      <div class="inspector-field inspector-field--full" style="margin-top:10px"><label>Posição sugerida</label><select data-frame-preset><option value="custom">Valores atuais</option><option value="safe-top">Topo seguro</option><option value="safe-bottom">Base segura</option><option value="left-column">Coluna esquerda</option><option value="main-column">Coluna principal</option><option value="full-width">Faixa total</option></select></div>
                      <button type="button" class="inspector-action--primary inspector-action--wide" data-frame-apply-all>Aplicar posição e tamanho</button>
                      <p class="inspector-note">Edite os quatro valores ou preencha uma sugestão. O documento só muda ao aplicar; mínimos, limites e autoridade de layout continuam respeitados.</p>
                    </div>
                    <div class="inspector-section__heading"><h4>Ajuste imediato por campo</h4><span>compatibilidade</span></div>
                    <div class="inspector-grid">'''
          if new not in source:
              if source.count(old) != 1:
                  raise SystemExit(f'inspector geometry target count {source.count(old)}')
              source = source.replace(old, new, 1)

          old = '''      const component = this.store.getSelected();
                if (target.matches("[data-table-row-path]")) {'''
          new = '''      const component = this.store.getSelected();
                if (target.matches("[data-frame-preset]")) {
                  const parentId = this.store.getParentId(component.id);
                  const size = this.store.getContainerSize(parentId);
                  const safe = parentId ? 0 : Math.max(0, Number(this.store.getPage().grid?.safeMargin) || 24);
                  const gap = Math.max(8, Number(component.constraints?.gridUnit) || 4) * 4;
                  const availableWidth = Math.max(1, size.width - safe * 2);
                  const technical = this.store.getMinimumProfile(component).technical;
                  const leftWidth = Math.max(Number(technical.width) || 1, Math.round((availableWidth - gap) * .28));
                  const mainX = safe + leftWidth + gap;
                  const frames = {
                    "safe-top": { ...component.frame, x: safe, y: safe },
                    "safe-bottom": { ...component.frame, y: Math.max(safe, size.height - safe - component.frame.height) },
                    "left-column": { ...component.frame, x: safe, width: leftWidth },
                    "main-column": { ...component.frame, x: mainX, width: Math.max(Number(technical.width) || 1, size.width - safe - mainX) },
                    "full-width": { ...component.frame, x: safe, width: availableWidth }
                  };
                  const frame = frames[target.value];
                  if (frame) Object.entries(frame).forEach(([key, value]) => {
                    const input = this.root.querySelector(`[data-frame-draft-path="${key}"]`);
                    if (input && Number.isFinite(Number(value))) input.value = Math.round(Number(value));
                  });
                  const status = document.getElementById("documentStatus");
                  if (status && frame) status.textContent = "Sugestão preenchida. Confirme para alterar o documento.";
                  return;
                }
                if (target.matches("[data-table-row-path]")) {'''
          if new not in source:
              if source.count(old) != 1:
                  raise SystemExit(f'inspector preset target count {source.count(old)}')
              source = source.replace(old, new, 1)

          old = '''      } else if (event.target.closest("[data-delete-component]")) {
          '''
          new = '''      } else if (event.target.closest("[data-frame-apply-all]")) {
                    try {
                      const entry = { id: component.id };
                      for (const key of ["x", "y", "width", "height"]) {
                        const value = Number(this.root.querySelector(`[data-frame-draft-path="${key}"]`)?.value);
                        if (!Number.isFinite(value)) throw new Error(`Informe um valor numérico para ${key}.`);
                        entry[key] = value;
                      }
                      this.store.applyComponentFramesBulk([entry]);
                      const status = document.getElementById("documentStatus");
                      if (status) status.textContent = "Posição e tamanho aplicados em uma única ação.";
                    } catch (error) {
                      const status = document.getElementById("documentStatus");
                      if (status) status.textContent = error.message;
                    }
                  } else if (event.target.closest("[data-delete-component]")) {
          '''
          if new not in source:
              if source.count(old) != 1:
                  raise SystemExit(f'inspector click target count {source.count(old)}')
              source = source.replace(old, new, 1)

          file.write_text(source)

          file = Path('tests/browser-promotional-generalization-05.20.test.js')
          source = file.read_text()
          old = '''async function showAdvancedGeometry() {
            if (await page.locator('[data-frame-path="x"]').count()) return;
            const toggle = page.locator('[data-toggle-all-properties]').first();
            await act("Mostrar geometria avançada", () => toggle.click());
            await page.locator('[data-frame-path="x"]').waitFor({ state: "attached" });
          }

          async function setFrame(frame) {
            await showAdvancedGeometry();
            for (const key of ["width", "height", "x", "y"]) {
              if (frame[key] == null) continue;
              await changeControl(`[data-frame-path="${key}"]`, frame[key], `Definir ${key} = ${frame[key]}`);
            }
          }
          '''
          new = '''async function showAdvancedGeometry() {
            if (await page.locator('[data-frame-draft-path="x"]').count()) return;
            const toggle = page.locator('[data-toggle-all-properties]').first();
            await act("Mostrar geometria avançada", () => toggle.click());
            await page.locator('[data-frame-draft-path="x"]').waitFor({ state: "attached" });
          }

          async function setFrame(frame) {
            await showAdvancedGeometry();
            await act(`Aplicar frame ${frame.x},${frame.y},${frame.width}×${frame.height}`, async () => {
              for (const key of ["x", "y", "width", "height"]) {
                if (frame[key] == null) continue;
                await page.locator(`[data-frame-draft-path="${key}"]`).fill(String(frame[key]));
              }
              await page.locator("[data-frame-apply-all]").click();
            });
            await wait(35);
          }
          '''
          if new not in source:
              if source.count(old) != 1:
                  raise SystemExit(f'benchmark frame helper target count {source.count(old)}')
              source = source.replace(old, new, 1)
          file.write_text(source)
          PY
          node --check app/document-store.js
          node --check authoring-kit/runtime/document-store.js
          node --check app/inspector.js
          node --check tests/browser-promotional-generalization-05.20.test.js
          node --check tests/browser-frame-application-05.20.5.test.js
      - name: Regenerate embedded AuthoringKit
        run: node tools/build-developer-b-authoring-kit.js
      - name: Verify and commit implementation
        shell: bash
        run: |
          set -euo pipefail
          cmp app/document-store.js authoring-kit/runtime/document-store.js
          mapfile -t actual < <(git diff --name-only --relative | sort)
          unexpected=()
          for file in "${actual[@]}"; do
            case "$file" in
              app/document-store.js|authoring-kit/runtime/document-store.js|app/inspector.js|tests/browser-promotional-generalization-05.20.test.js|app/authoring-kit-files.js|authoring-kit/capabilities.json|authoring-kit/feature-inventory.json|docs/FEATURE-CATALOG.md) ;;
              *) unexpected+=("$file") ;;
            esac
          done
          if [ "${#unexpected[@]}" -gt 0 ]; then
            echo 'Unexpected files:'
            printf '%s\n' "${unexpected[@]}"
            exit 1
          fi
          git diff --check
          git config user.name 'Developer B Audit'
          git config user.email 'developer-b-audit@users.noreply.github.com'
          git add -A
          git commit -m '05.20 — aplica posição e tamanho em uma transação'
          git push origin HEAD:agent/developer-b-05.18
