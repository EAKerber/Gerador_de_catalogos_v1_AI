name: Developer B Frame Application
on:
  pull_request:
    branches: [development]
    paths:
      - '.github/workflows/developer-b-frame-application-05-20.yml'
      - 'tests/browser-frame-application-05.20.5.test.js'
      - 'tests/browser-promotional-generalization-05.20.test.js'
      - 'app/document-store.js'
      - 'authoring-kit/runtime/document-store.js'
      - 'app/inspector.js'
permissions:
  contents: read
jobs:
  frame-application:
    name: DB-05.20.5 - joint frame application
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and parity
        run: |
          node --check app/document-store.js
          node --check authoring-kit/runtime/document-store.js
          node --check app/inspector.js
          node --check tests/browser-frame-application-05.20.5.test.js
          cmp app/document-store.js authoring-kit/runtime/document-store.js
          grep -q 'getBatchSelection(valid.map(entry => entry.id), 1)' app/document-store.js
          grep -q 'data-frame-apply-all' app/inspector.js
      - name: Install Playwright and select system Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@latest
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome_path"
          "$chrome_path" --version
          echo "CATALOG_CHROMIUM_EXECUTABLE=$chrome_path" >> "$GITHUB_ENV"
      - name: Start editor
        run: |
          python -m http.server 8080 > /tmp/catalog-http.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8080/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/catalog-http.log
          exit 1
      - name: Run frame application regression
        env:
          CATALOG_BASE_URL: http://127.0.0.1:8080
          CATALOG_FRAME_OUTPUT_DIR: audit-output/db-05.20.5/frame-application
        run: node tests/browser-frame-application-05.20.5.test.js
      - name: Upload frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-b-frame-application-05.20.5
          path: audit-output/db-05.20.5/frame-application
          if-no-files-found: error
          retention-days: 14
