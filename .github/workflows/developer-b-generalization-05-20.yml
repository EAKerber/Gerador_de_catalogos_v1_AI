name: Developer B Generalization Benchmark
on:
  pull_request:
    branches: [development]
    paths:
      - '.github/workflows/developer-b-generalization-05-20.yml'
      - 'tests/browser-promotional-generalization-05.20.test.js'
      - 'app/**'
      - 'styles/**'
permissions:
  contents: read
jobs:
  promotional-generalization:
    name: DB-05.20.1 - promotional generalization
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instrument real hit-testing sequence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          file = Path('tests/browser-promotional-generalization-05.20.test.js')
          source = file.read_text()
          old = '''  const target = await content.count() ? content : root;
            await act(`Selecionar componente ${id}`, () => target.click({ force: true }));
          '''
          new = '''  const target = await content.count() ? content : root;
            const hitBefore = await target.evaluate(element => {
              if (!window.__catalogHitTraceInstalled) {
                window.__catalogHitTraceInstalled = true;
                window.__catalogHitTrace = [];
                for (const type of ["pointerdown", "click"]) document.addEventListener(type, event => {
                  const path = event.composedPath().slice(0, 10).map(node => ({
                    tag: node?.tagName?.toLowerCase?.() || null,
                    className: typeof node?.className === "string" ? node.className : "",
                    componentId: node?.closest?.("[data-component-id]")?.dataset?.componentId || null,
                    componentType: node?.closest?.("[data-component-id]")?.dataset?.componentType || null,
                    opensAsset: Boolean(node?.closest?.("[data-open-asset-library]"))
                  }));
                  window.__catalogHitTrace.push({ type, target: path[0], path });
                  if (window.__catalogHitTrace.length > 30) window.__catalogHitTrace.shift();
                }, true);
              }
              window.__catalogHitTrace = [];
              const rect = element.getBoundingClientRect();
              const x = rect.left + rect.width / 2;
              const y = rect.top + rect.height / 2;
              return {
                rect: { left: rect.left, top: rect.top, right: rect.right, bottom: rect.bottom, width: rect.width, height: rect.height },
                point: { x, y },
                selectedBefore: CatalogEditor.store.getSelected()?.id || null,
                contextBefore: CatalogEditor.store.getState().editor.editingContextId || null,
                stack: document.elementsFromPoint(x, y).slice(0, 12).map(node => ({
                  tag: node.tagName.toLowerCase(),
                  className: typeof node.className === "string" ? node.className : "",
                  componentId: node.closest?.("[data-component-id]")?.dataset?.componentId || null,
                  componentType: node.closest?.("[data-component-id]")?.dataset?.componentType || null,
                  opensAsset: Boolean(node.closest?.("[data-open-asset-library]")),
                  zIndex: getComputedStyle(node).zIndex,
                  pointerEvents: getComputedStyle(node).pointerEvents
                }))
              };
            });
            await act(`Selecionar componente ${id}`, () => target.click({ force: true }));
          '''
          if source.count(old) != 1:
              raise SystemExit(f'Instrumentation target count: {source.count(old)}')
          source = source.replace(old, new, 1)
          old_finding = '    findings.push({ code: "CANVAS_SELECTION_INTERCEPTED", componentId: id, message: "A tentativa de selecionar uma peça interna abriu a biblioteca de artes; a seleção continuou pela árvore de Camadas." });\n'
          new_finding = '''    const hitAfter = await page.evaluate(componentId => {
              const targetRoot = document.querySelector(`[data-component-id="${CSS.escape(componentId)}"]`);
              const selected = CatalogEditor.store.getSelected();
              const selectedRoot = selected ? document.querySelector(`[data-component-id="${CSS.escape(selected.id)}"]`) : null;
              const rect = element => {
                const box = element?.getBoundingClientRect();
                return box ? { left: box.left, top: box.top, right: box.right, bottom: box.bottom, width: box.width, height: box.height } : null;
              };
              return {
                trace: (window.__catalogHitTrace || []).slice(-6),
                selectedAfter: selected?.id || null,
                contextAfter: CatalogEditor.store.getState().editor.editingContextId || null,
                targetRect: rect(targetRoot),
                selectedRect: rect(selectedRoot)
              };
            }, id);
            findings.push({ code: "CANVAS_SELECTION_INTERCEPTED", componentId: id, message: "A tentativa de selecionar uma peça interna abriu a biblioteca de artes; a seleção continuou pela árvore de Camadas.", hitBefore, hitAfter });
          '''
          if source.count(old_finding) != 1:
              raise SystemExit(f'Finding target count: {source.count(old_finding)}')
          source = source.replace(old_finding, new_finding, 1)
          file.write_text(source)
          PY
      - name: Validate benchmark syntax
        run: node --check tests/browser-promotional-generalization-05.20.test.js
      - name: Install Playwright and select system Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@latest
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome_path"
          "$chrome_path" --version
          echo "CATALOG_CHROMIUM_EXECUTABLE=$chrome_path" >> "$GITHUB_ENV"
      - name: Start editor
        run: |
          python -m http.server 8080 > /tmp/catalog-http.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8080/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/catalog-http.log
          exit 1
      - name: Run promotional benchmark
        env:
          CATALOG_BASE_URL: http://127.0.0.1:8080
          CATALOG_GENERALIZATION_OUTPUT_DIR: audit-output/db-05.20.1/promotional
        run: node tests/browser-promotional-generalization-05.20.test.js
      - name: Summarize benchmark
        if: always()
        shell: bash
        run: |
          report='audit-output/db-05.20.1/promotional/promotional-generalization-report.json'
          if [ -f "$report" ]; then
            node - "$report" <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log(JSON.stringify({
            status: report.status,
            durationMs: report.durationMs,
            actionCount: report.actionCount,
            historyRoundTrip: report.historyRoundTrip,
            exportImport: report.exportImport,
            publication: report.metrics?.publication,
            findings: report.findings,
            blockers: report.blockers,
            fatalError: report.fatalError
          }, null, 2));
          NODE
          else
            echo 'Benchmark report was not generated.'
            exit 1
          fi
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-b-promotional-generalization-05.20.1
          path: audit-output/db-05.20.1/promotional
          if-no-files-found: error
          retention-days: 14
