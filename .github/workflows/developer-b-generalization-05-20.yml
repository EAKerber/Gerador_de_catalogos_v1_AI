name: Developer B Generalization Benchmark
on:
  pull_request:
    branches: [development]
    paths:
      - '.github/workflows/developer-b-generalization-05-20.yml'
      - 'tests/browser-promotional-generalization-05.20.test.js'
      - 'app/**'
      - 'styles/**'
permissions:
  contents: read
jobs:
  promotional-generalization:
    name: DB-05.20.1 - promotional generalization
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply benchmark harness corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          file = Path('tests/browser-promotional-generalization-05.20.test.js')
          source = file.read_text()

          grid_old = '  if (await page.locator("#gridToggle").isChecked()) await act("Ocultar grade", () => page.locator("#gridToggle").uncheck());\n'
          grid_new = '''  if (await page.locator("#gridToggle").isChecked()) {
            await act("Abrir preferências de visualização", () => page.locator("#visualizationMenu > summary").click());
            await act("Ocultar grade", () => page.locator("#gridToggle").uncheck());
            await act("Fechar preferências de visualização", () => page.locator("#visualizationMenu > summary").click());
          }
          '''
          if grid_old not in source:
              raise SystemExit('Grid harness target not found.')
          source = source.replace(grid_old, grid_new, 1)

          selection_old = '''async function selectComponent(id) {
            const content = page.locator(`${selectorForComponent(id)} > .editor-component__content`).first();
            const root = page.locator(selectorForComponent(id)).first();
            const target = await content.count() ? content : root;
            await act(`Selecionar componente ${id}`, () => target.click({ force: true }));
            await page.waitForFunction(componentId => CatalogEditor.store.getSelected()?.id === componentId, id, { timeout: 2000 });
          }
          '''
          selection_new = '''async function selectComponent(id) {
            const content = page.locator(`${selectorForComponent(id)} > .editor-component__content`).first();
            const root = page.locator(selectorForComponent(id)).first();
            const target = await content.count() ? content : root;
            await act(`Selecionar componente ${id}`, () => target.click({ force: true }));
            try {
              await page.waitForFunction(componentId => CatalogEditor.store.getSelected()?.id === componentId, id, { timeout: 500 });
              return;
            } catch {}

            const layersTab = page.locator('[data-left-panel-tab="layers"]');
            if (await layersTab.getAttribute("aria-selected") !== "true") await act("Abrir aba Camadas", () => layersTab.click());
            const layerItem = page.locator(`[data-layer-id="${id}"]`).first();
            await layerItem.waitFor({ state: "visible" });
            await act(`Selecionar ${id} pela árvore de camadas`, () => layerItem.click());
            await page.waitForFunction(componentId => CatalogEditor.store.getSelected()?.id === componentId, id, { timeout: 2000 });
            const componentsTab = page.locator('[data-left-panel-tab="components"]');
            if (await componentsTab.getAttribute("aria-selected") !== "true") await act("Voltar à aba Componentes", () => componentsTab.click());
          }
          '''
          if selection_old not in source:
              raise SystemExit('Selection harness target not found.')
          source = source.replace(selection_old, selection_new, 1)
          file.write_text(source)
          PY
      - name: Validate benchmark syntax
        run: node --check tests/browser-promotional-generalization-05.20.test.js
      - name: Install Playwright and select system Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@latest
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome_path"
          "$chrome_path" --version
          echo "CATALOG_CHROMIUM_EXECUTABLE=$chrome_path" >> "$GITHUB_ENV"
      - name: Start editor
        run: |
          python -m http.server 8080 > /tmp/catalog-http.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8080/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/catalog-http.log
          exit 1
      - name: Run promotional benchmark
        env:
          CATALOG_BASE_URL: http://127.0.0.1:8080
          CATALOG_GENERALIZATION_OUTPUT_DIR: audit-output/db-05.20.1/promotional
        run: node tests/browser-promotional-generalization-05.20.test.js
      - name: Summarize benchmark
        if: always()
        shell: bash
        run: |
          report='audit-output/db-05.20.1/promotional/promotional-generalization-report.json'
          if [ -f "$report" ]; then
            node - "$report" <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log(JSON.stringify({
            status: report.status,
            durationMs: report.durationMs,
            actionCount: report.actionCount,
            historyRoundTrip: report.historyRoundTrip,
            exportImport: report.exportImport,
            publication: report.metrics?.publication,
            findings: report.findings,
            blockers: report.blockers,
            fatalError: report.fatalError
          }, null, 2));
          NODE
          else
            echo 'Benchmark report was not generated.'
            exit 1
          fi
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-b-promotional-generalization-05.20.1
          path: audit-output/db-05.20.1/promotional
          if-no-files-found: error
          retention-days: 14
