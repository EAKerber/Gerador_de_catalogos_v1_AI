<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Troubleshooting — do erro ao gate verde</title><desc id="desc">Toda falha deve apontar para um contrato e uma correção verificável</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/></marker><style>.title{font:700 40px Arial,sans-serif;fill:#15191f}.subtitle{font:22px Arial,sans-serif;fill:#505865}.step{font:600 18px Arial,sans-serif;fill:#20252b}.number{font:700 14px Arial,sans-serif;fill:#fff}</style></defs><rect width="100%" height="100%" fill="#f5f7fa"/><rect x="0" y="0" width="16" height="100%" fill="#b91c1c"/><text x="56" y="76" class="title">Troubleshooting — do erro ao gate verde</text><text x="56" y="116" class="subtitle">Toda falha deve apontar para um contrato e uma correção verificável</text><path d="M 314 261 H 329" stroke="#b91c1c" stroke-width="4" marker-end="url(#arrow)"/><path d="M 594 261 H 609" stroke="#b91c1c" stroke-width="4" marker-end="url(#arrow)"/><path d="M 874 261 H 889" stroke="#b91c1c" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="56" y="190" width="252" height="142" rx="18" fill="#ffffff" stroke="#d7dce3" stroke-width="2"/><circle cx="86" cy="220" r="18" fill="#b91c1c"/><text x="86" y="226" text-anchor="middle" class="number">01</text><text x="80" y="262" class="step">Leia code + severity</text><text x="80" y="286" class="step">em issues[]</text></g><g><rect x="336" y="190" width="252" height="142" rx="18" fill="#ffffff" stroke="#d7dce3" stroke-width="2"/><circle cx="366" cy="220" r="18" fill="#b91c1c"/><text x="366" y="226" text-anchor="middle" class="number">02</text><text x="360" y="262" class="step">Localize componentId</text><text x="360" y="286" class="step">assetId ou path</text></g><g><rect x="616" y="190" width="252" height="142" rx="18" fill="#ffffff" stroke="#d7dce3" stroke-width="2"/><circle cx="646" cy="220" r="18" fill="#b91c1c"/><text x="646" y="226" text-anchor="middle" class="number">03</text><text x="640" y="262" class="step">Corrija o fato</text><text x="640" y="286" class="step">vínculo ou geometria</text></g><g><rect x="896" y="190" width="252" height="142" rx="18" fill="#ffffff" stroke="#d7dce3" stroke-width="2"/><circle cx="926" cy="220" r="18" fill="#b91c1c"/><text x="926" y="226" text-anchor="middle" class="number">04</text><text x="920" y="262" class="step">Recompile e valide</text><text x="920" y="286" class="step">zero bloqueadores</text></g><g><rect x="56" y="380" width="252" height="142" rx="18" fill="#ffffff" stroke="#d7dce3" stroke-width="2"/><circle cx="86" cy="410" r="18" fill="#b91c1c"/><text x="86" y="416" text-anchor="middle" class="number">05</text><text x="80" y="452" class="step">Revise no editor</text><text x="80" y="476" class="step">e exporte novamente</text></g></svg>