<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="930" viewBox="0 0 1800 930" role="img" aria-labelledby="title desc"><title id="title">Mapa anotado da interface do Catálogo V1</title><desc id="desc">Captura real 05.17 da interface com as superfícies principais numeradas e contratos verificados no 05.55.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#dc2626"/></marker><style>.title{font:700 34px Arial,sans-serif;fill:#171b21}.label{font:700 20px Arial,sans-serif;fill:#fff}.note{font:18px Arial,sans-serif;fill:#343a42}.line{stroke:#dc2626;stroke-width:5;fill:none;marker-end:url(#arrow)}</style></defs><rect width="100%" height="100%" fill="#f5f7fa"/><text x="50" y="55" class="title">Mapa da interface — captura 05.17 + contratos verificados no 05.55</text><image href="editor-reference.png" x="50" y="90" width="1093" height="614" preserveAspectRatio="xMidYMid meet"/><g><path class="line" d="M 1220 160 L 1045 180"/><circle cx="1260" cy="150" r="27" fill="#dc2626"/><text x="1260" y="157" text-anchor="middle" class="label">1</text><text x="1300" y="157" class="note">Toolbar, importação e exportação</text><path class="line" d="M 1220 260 L 190 320"/><circle cx="1260" cy="250" r="27" fill="#dc2626"/><text x="1260" y="257" text-anchor="middle" class="label">2</text><text x="1300" y="257" class="note">Biblioteca, produtos e camadas</text><path class="line" d="M 1220 360 L 720 390"/><circle cx="1260" cy="350" r="27" fill="#dc2626"/><text x="1260" y="357" text-anchor="middle" class="label">3</text><text x="1300" y="357" class="note">Canvas A4 e contexto atual</text><path class="line" d="M 1220 460 L 1035 400"/><circle cx="1260" cy="450" r="27" fill="#dc2626"/><text x="1260" y="457" text-anchor="middle" class="label">4</text><text x="1300" y="457" class="note">Inspetor: Conteúdo, Layout, Visual</text><path class="line" d="M 1220 560 L 735 690"/><circle cx="1260" cy="550" r="27" fill="#dc2626"/><text x="1260" y="557" text-anchor="middle" class="label">5</text><text x="1300" y="557" class="note">Status, atalhos e diagnóstico</text></g><rect x="50" y="750" width="1690" height="130" rx="18" fill="#fff" stroke="#d7dce3" stroke-width="2"/><text x="80" y="796" class="note">A captura é material tutorial, não golden image. Use os nomes de controles e caminhos JSON do tutorial como contrato;</text><text x="80" y="832" class="note">use a imagem para orientação espacial. Viewport: 1366×768 · origem: evidência real 05.17.</text></svg>