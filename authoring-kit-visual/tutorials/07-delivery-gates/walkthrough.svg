<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Gate de entrega</title><desc id="desc">O documento importado é a autoridade</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker><style>.title{font:700 40px Arial,sans-serif;fill:#15191f}.subtitle{font:22px Arial,sans-serif;fill:#505865}.step{font:600 18px Arial,sans-serif;fill:#20252b}.number{font:700 14px Arial,sans-serif;fill:#fff}</style></defs><rect width="100%" height="100%" fill="#f5f7fa"/><rect x="0" y="0" width="16" height="100%" fill="#dc2626"/><text x="56" y="76" class="title">Gate de entrega</text><text x="56" y="116" class="subtitle">O documento importado é a autoridade</text><path d="M 314 261 H 329" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/><path d="M 594 261 H 609" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/><path d="M 874 261 H 889" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/><path d="M 314 451 H 329" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="56" y="190" width="252" height="142" rx="18" fill="#ffffff" stroke="#d7dce3" stroke-width="2"/><circle cx="86" cy="220" r="18" fill="#dc2626"/><text x="86" y="226" text-anchor="middle" class="number">01</text><text x="80" y="262" class="step">Compile a fonte</text><text x="80" y="286" class="step">e leia issues</text></g><g><rect x="336" y="190" width="252" height="142" rx="18" fill="#ffffff" stroke="#d7dce3" stroke-width="2"/><circle cx="366" cy="220" r="18" fill="#dc2626"/><text x="366" y="226" text-anchor="middle" class="number">02</text><text x="360" y="262" class="step">Audite defaults</text><text x="360" y="286" class="step">e fatos materializados</text></g><g><rect x="616" y="190" width="252" height="142" rx="18" fill="#ffffff" stroke="#d7dce3" stroke-width="2"/><circle cx="646" cy="220" r="18" fill="#dc2626"/><text x="646" y="226" text-anchor="middle" class="number">03</text><text x="640" y="262" class="step">Importe no editor</text><text x="640" y="286" class="step">e rode gates reais</text></g><g><rect x="896" y="190" width="252" height="142" rx="18" fill="#ffffff" stroke="#d7dce3" stroke-width="2"/><circle cx="926" cy="220" r="18" fill="#dc2626"/><text x="926" y="226" text-anchor="middle" class="number">04</text><text x="920" y="262" class="step">Ignore preview paralelo</text><text x="920" y="286" class="step">como resultado final</text></g><g><rect x="56" y="380" width="252" height="142" rx="18" fill="#ffffff" stroke="#d7dce3" stroke-width="2"/><circle cx="86" cy="410" r="18" fill="#dc2626"/><text x="86" y="416" text-anchor="middle" class="number">05</text><text x="80" y="452" class="step">Reexporte pacote</text><text x="80" y="476" class="step">e confirme round-trip</text></g><g><rect x="336" y="380" width="252" height="142" rx="18" fill="#ffffff" stroke="#d7dce3" stroke-width="2"/><circle cx="366" cy="410" r="18" fill="#dc2626"/><text x="366" y="416" text-anchor="middle" class="number">06</text><text x="360" y="452" class="step">Gere PDF</text><text x="360" y="476" class="step">sem chrome do editor</text></g></svg>