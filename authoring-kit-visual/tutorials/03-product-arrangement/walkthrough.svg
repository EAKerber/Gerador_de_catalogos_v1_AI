<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc"><title id="title">Modo editorial versus arranjo</title><desc id="desc">Semântica e geometria são decisões independentes</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker><style>.title{font:700 40px Arial,sans-serif;fill:#15191f}.subtitle{font:22px Arial,sans-serif;fill:#505865}.step{font:600 18px Arial,sans-serif;fill:#20252b}.number{font:700 14px Arial,sans-serif;fill:#fff}</style></defs><rect width="100%" height="100%" fill="#f5f7fa"/><rect x="0" y="0" width="16" height="100%" fill="#dc2626"/><text x="56" y="76" class="title">Modo editorial versus arranjo</text><text x="56" y="116" class="subtitle">Semântica e geometria são decisões independentes</text><path d="M 314 261 H 329" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/><path d="M 594 261 H 609" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/><path d="M 874 261 H 889" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="56" y="190" width="252" height="142" rx="18" fill="#ffffff" stroke="#d7dce3" stroke-width="2"/><circle cx="86" cy="220" r="18" fill="#dc2626"/><text x="86" y="226" text-anchor="middle" class="number">01</text><text x="80" y="262" class="step">Escolha o modo</text><text x="80" y="286" class="step">hero / technical / variants</text></g><g><rect x="336" y="190" width="252" height="142" rx="18" fill="#ffffff" stroke="#d7dce3" stroke-width="2"/><circle cx="366" cy="220" r="18" fill="#dc2626"/><text x="366" y="226" text-anchor="middle" class="number">02</text><text x="360" y="262" class="step">Avalie a região</text><text x="360" y="286" class="step">arte + informação</text></g><g><rect x="616" y="190" width="252" height="142" rx="18" fill="#ffffff" stroke="#d7dce3" stroke-width="2"/><circle cx="646" cy="220" r="18" fill="#dc2626"/><text x="646" y="226" text-anchor="middle" class="number">03</text><text x="640" y="262" class="step">Defina arrangement</text><text x="640" y="286" class="step">auto / horizontal / stacked</text></g><g><rect x="896" y="190" width="252" height="142" rx="18" fill="#ffffff" stroke="#d7dce3" stroke-width="2"/><circle cx="926" cy="220" r="18" fill="#dc2626"/><text x="926" y="226" text-anchor="middle" class="number">04</text><text x="920" y="262" class="step">Valide mínimos</text><text x="920" y="286" class="step">clipping e leitura</text></g></svg>