<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title"><title id="title">Cookbook — modo editorial e arranjo</title><style>.title{font:700 38px Arial,sans-serif;fill:#171b21}.heading{font:700 22px Arial,sans-serif;fill:#fff}.row{font:18px Arial,sans-serif;fill:#262b31}.contract{font:600 15px monospace;fill:#555d68}</style><rect width="100%" height="100%" fill="#f5f7fa"/><text x="58" y="76" class="title">Cookbook — modo editorial e arranjo</text><g><rect x="58" y="150" width="338" height="330" rx="22" fill="#fff" stroke="#b91c1c" stroke-width="4"/><rect x="58" y="150" width="338" height="64" rx="20" fill="#b91c1c"/><rect x="58" y="194" width="338" height="20" fill="#b91c1c"/><text x="82" y="191" class="heading">hero + horizontal</text><g><circle cx="80" cy="238" r="7" fill="#b91c1c"/><text x="100" y="245" class="row">arte em destaque</text></g><g><circle cx="80" cy="282" r="7" fill="#b91c1c"/><text x="100" y="289" class="row">informação ao lado</text></g><g><circle cx="80" cy="326" r="7" fill="#b91c1c"/><text x="100" y="333" class="row">card amplo</text></g><text x="80" y="445" class="contract">mode=hero · arrangement=horizontal</text></g><g><rect x="440" y="150" width="338" height="330" rx="22" fill="#fff" stroke="#1d4ed8" stroke-width="4"/><rect x="440" y="150" width="338" height="64" rx="20" fill="#1d4ed8"/><rect x="440" y="194" width="338" height="20" fill="#1d4ed8"/><text x="464" y="191" class="heading">technical + stacked</text><g><circle cx="462" cy="238" r="7" fill="#1d4ed8"/><text x="482" y="245" class="row">arte acima</text></g><g><circle cx="462" cy="282" r="7" fill="#1d4ed8"/><text x="482" y="289" class="row">especificações abaixo</text></g><g><circle cx="462" cy="326" r="7" fill="#1d4ed8"/><text x="482" y="333" class="row">densidade técnica</text></g><text x="462" y="445" class="contract">mode=technical · arrangement=stacked</text></g><g><rect x="822" y="150" width="338" height="330" rx="22" fill="#fff" stroke="#7c3aed" stroke-width="4"/><rect x="822" y="150" width="338" height="64" rx="20" fill="#7c3aed"/><rect x="822" y="194" width="338" height="20" fill="#7c3aed"/><text x="846" y="191" class="heading">variants + auto</text><g><circle cx="844" cy="238" r="7" fill="#7c3aed"/><text x="864" y="245" class="row">galeria priorizada</text></g><g><circle cx="844" cy="282" r="7" fill="#7c3aed"/><text x="864" y="289" class="row">legendas vinculadas</text></g><g><circle cx="844" cy="326" r="7" fill="#7c3aed"/><text x="864" y="333" class="row">auto empilha</text></g><text x="844" y="445" class="contract">mode=variants · arrangement=auto</text></g></svg>