<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title"><title id="title">Cookbook — ordem do enquadramento factual</title><style>.title{font:700 38px Arial,sans-serif;fill:#171b21}.heading{font:700 22px Arial,sans-serif;fill:#fff}.row{font:18px Arial,sans-serif;fill:#262b31}.contract{font:600 15px monospace;fill:#555d68}</style><rect width="100%" height="100%" fill="#f5f7fa"/><text x="58" y="76" class="title">Cookbook — ordem do enquadramento factual</text><g><rect x="58" y="150" width="338" height="330" rx="22" fill="#fff" stroke="#047857" stroke-width="4"/><rect x="58" y="150" width="338" height="64" rx="20" fill="#047857"/><rect x="58" y="194" width="338" height="20" fill="#047857"/><text x="82" y="191" class="heading">1 · instância</text><g><circle cx="80" cy="238" r="7" fill="#047857"/><text x="100" y="245" class="row">fit, foco, zoom e offset</text></g><g><circle cx="80" cy="282" r="7" fill="#047857"/><text x="100" y="289" class="row">mesmo asset e hash</text></g><g><circle cx="80" cy="326" r="7" fill="#047857"/><text x="100" y="333" class="row">ocupação contextual</text></g><text x="80" y="445" class="contract">art.props · não destrutivo</text></g><g><rect x="440" y="150" width="338" height="330" rx="22" fill="#fff" stroke="#1d4ed8" stroke-width="4"/><rect x="440" y="150" width="338" height="64" rx="20" fill="#1d4ed8"/><rect x="440" y="194" width="338" height="20" fill="#1d4ed8"/><text x="464" y="191" class="heading">2 · recorte neutro</text><g><circle cx="462" cy="238" r="7" fill="#1d4ed8"/><text x="482" y="245" class="row">remove margem incorporada</text></g><g><circle cx="462" cy="282" r="7" fill="#1d4ed8"/><text x="482" y="289" class="row">derivado específico por uso</text></g><g><circle cx="462" cy="326" r="7" fill="#1d4ed8"/><text x="482" y="333" class="row">sem cortar produto</text></g><text x="462" y="445" class="contract">method=neutral-margin-crop</text></g><g><rect x="822" y="150" width="338" height="330" rx="22" fill="#fff" stroke="#d97706" stroke-width="4"/><rect x="822" y="150" width="338" height="64" rx="20" fill="#d97706"/><rect x="822" y="194" width="338" height="20" fill="#d97706"/><text x="846" y="191" class="heading">3 · expandir fundo</text><g><circle cx="844" cy="238" r="7" fill="#d97706"/><text x="864" y="245" class="row">continuidade do canvas</text></g><g><circle cx="844" cy="282" r="7" fill="#d97706"/><text x="864" y="289" class="row">não aumenta ocupação</text></g><g><circle cx="844" cy="326" r="7" fill="#d97706"/><text x="864" y="333" class="row">novo hash e proveniência</text></g><text x="844" y="445" class="contract">method=neutral-background-expansion</text></g></svg>