<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title"><title id="title">Cookbook — specification, fact ou legenda</title><style>.title{font:700 38px Arial,sans-serif;fill:#171b21}.heading{font:700 22px Arial,sans-serif;fill:#fff}.row{font:18px Arial,sans-serif;fill:#262b31}.contract{font:600 15px monospace;fill:#555d68}</style><rect width="100%" height="100%" fill="#f5f7fa"/><text x="58" y="76" class="title">Cookbook — specification, fact ou legenda</text><g><rect x="58" y="150" width="338" height="330" rx="22" fill="#fff" stroke="#b91c1c" stroke-width="4"/><rect x="58" y="150" width="338" height="64" rx="20" fill="#b91c1c"/><rect x="58" y="194" width="338" height="20" fill="#b91c1c"/><text x="82" y="191" class="heading">specification</text><g><circle cx="80" cy="238" r="7" fill="#b91c1c"/><text x="100" y="245" class="row">atributo curto</text></g><g><circle cx="80" cy="282" r="7" fill="#b91c1c"/><text x="100" y="289" class="row">ligado ao produto</text></g><g><circle cx="80" cy="326" r="7" fill="#b91c1c"/><text x="100" y="333" class="row">normalmente com ícone</text></g><text x="80" y="445" class="contract">component.type=specification</text></g><g><rect x="440" y="150" width="338" height="330" rx="22" fill="#fff" stroke="#1d4ed8" stroke-width="4"/><rect x="440" y="150" width="338" height="64" rx="20" fill="#1d4ed8"/><rect x="440" y="194" width="338" height="20" fill="#1d4ed8"/><text x="464" y="191" class="heading">fact</text><g><circle cx="462" cy="238" r="7" fill="#1d4ed8"/><text x="482" y="245" class="row">rótulo + valor + unidade</text></g><g><circle cx="462" cy="282" r="7" fill="#1d4ed8"/><text x="482" y="289" class="row">dado autônomo</text></g><g><circle cx="462" cy="326" r="7" fill="#1d4ed8"/><text x="482" y="333" class="row">ex.: carga 40 kg</text></g><text x="462" y="445" class="contract">recipeId=fact</text></g><g><rect x="822" y="150" width="338" height="330" rx="22" fill="#fff" stroke="#047857" stroke-width="4"/><rect x="822" y="150" width="338" height="64" rx="20" fill="#047857"/><rect x="822" y="194" width="338" height="20" fill="#047857"/><text x="846" y="191" class="heading">legend-item</text><g><circle cx="844" cy="238" r="7" fill="#047857"/><text x="864" y="245" class="row">classificação compartilhada</text></g><g><circle cx="844" cy="282" r="7" fill="#047857"/><text x="864" y="289" class="row">resolvida por legendKey</text></g><g><circle cx="844" cy="326" r="7" fill="#047857"/><text x="864" y="333" class="row">não por posição</text></g><text x="844" y="445" class="contract">component.type=legend-item</text></g></svg>