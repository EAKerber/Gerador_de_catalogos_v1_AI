<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title"><title id="title">Cookbook — identidade e apresentação de colunas</title><style>.title{font:700 38px Arial,sans-serif;fill:#171b21}.heading{font:700 22px Arial,sans-serif;fill:#fff}.row{font:18px Arial,sans-serif;fill:#262b31}.contract{font:600 15px monospace;fill:#555d68}</style><rect width="100%" height="100%" fill="#f5f7fa"/><text x="58" y="76" class="title">Cookbook — identidade e apresentação de colunas</text><g><rect x="58" y="150" width="338" height="330" rx="22" fill="#fff" stroke="#334155" stroke-width="4"/><rect x="58" y="150" width="338" height="64" rx="20" fill="#334155"/><rect x="58" y="194" width="338" height="20" fill="#334155"/><text x="82" y="191" class="heading">key</text><g><circle cx="80" cy="238" r="7" fill="#334155"/><text x="100" y="245" class="row">binding estável</text></g><g><circle cx="80" cy="282" r="7" fill="#334155"/><text x="100" y="289" class="row">identidade da célula</text></g><g><circle cx="80" cy="326" r="7" fill="#334155"/><text x="100" y="333" class="row">não renomear por estética</text></g><text x="80" y="445" class="contract">columns[].key</text></g><g><rect x="440" y="150" width="338" height="330" rx="22" fill="#fff" stroke="#b91c1c" stroke-width="4"/><rect x="440" y="150" width="338" height="64" rx="20" fill="#b91c1c"/><rect x="440" y="194" width="338" height="20" fill="#b91c1c"/><text x="464" y="191" class="heading">label + ordem</text><g><circle cx="462" cy="238" r="7" fill="#b91c1c"/><text x="482" y="245" class="row">texto do cabeçalho</text></g><g><circle cx="462" cy="282" r="7" fill="#b91c1c"/><text x="482" y="289" class="row">ordem no array</text></g><g><circle cx="462" cy="326" r="7" fill="#b91c1c"/><text x="482" y="333" class="row">mudança editorial segura</text></g><text x="462" y="445" class="contract">columns[].label</text></g><g><rect x="822" y="150" width="338" height="330" rx="22" fill="#fff" stroke="#047857" stroke-width="4"/><rect x="822" y="150" width="338" height="64" rx="20" fill="#047857"/><rect x="822" y="194" width="338" height="20" fill="#047857"/><text x="846" y="191" class="heading">visible</text><g><circle cx="844" cy="238" r="7" fill="#047857"/><text x="864" y="245" class="row">false oculta projeção</text></g><g><circle cx="844" cy="282" r="7" fill="#047857"/><text x="864" y="289" class="row">dados continuam presentes</text></g><g><circle cx="844" cy="326" r="7" fill="#047857"/><text x="864" y="333" class="row">uma coluna sempre visível</text></g><text x="844" y="445" class="contract">columns[].visible</text></g></svg>